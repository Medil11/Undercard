services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: esport
      POSTGRES_PASSWORD: esport
      POSTGRES_DB: esport
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U esport"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://esport:esport@db:5432/esport
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  ingestion:
    build: ./backend
    command: ["python", "-m", "ingestion.sync", "--loop", "--interval", "60"]
    environment:
      DATABASE_URL: postgresql+psycopg://esport:esport@db:5432/esport
      PANDASCORE_TOKEN: ${PANDASCORE_TOKEN}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
