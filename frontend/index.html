<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#191c22" media="(prefers-color-scheme: dark)">
<title>Undercard</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preload" href="fonts/archivo-latin.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:"Archivo";font-style:normal;font-weight:100 900;font-display:swap;src:url("fonts/archivo-latin.woff2") format("woff2");unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD}
@font-face{font-family:"Archivo";font-style:normal;font-weight:100 900;font-display:swap;src:url("fonts/archivo-latin-ext.woff2") format("woff2");unicode-range:U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF}
:root{
  --bg:#eef1f5;--card:#fff;--ink:#1d2026;--text:#1d2026;--mut:#6a717d;--line:#e7eaef;--hover:#f5f7fa;
  --live:#e5243b;--live-bg:#fdecee;--dot:#d9dde3;--brand:#ffd400;
  --plate:#e9ecf0;--plate-lt:#1d2026;--plate-dk:transparent;
  --r-card:16px;--r-av:8px;
  --font:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --ease:cubic-bezier(.16,1,.3,1);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f1115;--card:#191c22;--ink:#eceef1;--text:#eceef1;--mut:#9aa1ad;--line:#262a31;--hover:#20242b;
  --live:#ff4d5e;--live-bg:rgba(255,77,94,.14);--dot:#353a43;
  --plate:#2a2f37;--plate-lt:transparent;--plate-dk:#e9ecf0;
  color-scheme:dark;
}}
*,*::before,*::after{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--text);font:400 15px/20px var(--font);-webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom,0px)}
::selection{background:var(--ink);color:var(--card)}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* Header */
.hd{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.hd-in{max-width:1200px;margin:0 auto;padding:0 20px;height:60px;display:grid;grid-template-columns:auto 1fr auto;align-items:center;column-gap:32px}
.logo{display:flex;align-items:center;gap:8px;text-decoration:none;font-weight:800;font-size:20px;letter-spacing:-.01em}
.logo svg{width:30px;height:28px;flex:none}
.seg{display:inline-flex;gap:4px;padding:4px;background:var(--bg);border-radius:999px;justify-self:start;max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;white-space:nowrap}
.seg button{display:flex;align-items:center;gap:6px;border:0;background:none;padding:6px 14px;border-radius:999px;font-weight:600;font-size:14px;color:var(--mut);transition:background-color .15s var(--ease),color .15s var(--ease)}
.seg button:hover{color:var(--text)}
.seg button[aria-selected="true"]{background:var(--ink);color:var(--card)}
.seg .c{font-weight:500;opacity:.7}
.seg .dot{width:6px;height:6px;border-radius:50%;background:var(--live)}
.status{font-size:13px;color:var(--mut);text-align:right}

/* Layout */
.shell{max-width:1200px;margin:0 auto;padding:20px;display:grid;grid-template-columns:232px minmax(0,1fr);gap:20px;align-items:start}
.card{background:var(--card);border-radius:var(--r-card);overflow:hidden}
.side{position:sticky;top:80px;padding:8px}
.side h2{margin:8px 12px 6px;font-size:13px;font-weight:600;color:var(--mut)}
.nav{display:flex;align-items:center;justify-content:space-between;width:100%;border:0;background:none;padding:9px 12px;border-radius:10px;text-align:left;font-size:14px;font-weight:500;transition:background-color .15s var(--ease)}
.nav:hover{background:var(--hover)}
.nav[aria-pressed="true"]{background:var(--bg);font-weight:700}
.nav .c{color:var(--mut);font-weight:500}
.nav.z{color:var(--mut)}
.chips{display:none}
main{display:grid;gap:16px;min-width:0}

/* Tournament card + match rows */
.th{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:14px 16px 10px}
.th .lg{font-weight:700;font-size:14px;min-width:0}
.th .lg span{font-weight:500;color:var(--mut);margin-left:6px}
.th .rt{display:flex;gap:12px;flex:none;font-size:13px;color:var(--mut)}
.row{display:grid;grid-template-columns:64px minmax(0,1fr) auto 28px;column-gap:16px;align-items:center;padding:10px 16px;border-top:1px solid var(--line);text-decoration:none;transition:background-color .15s var(--ease)}
a.row:hover{background:var(--hover)}
a.row:focus-visible{outline-offset:-2px;border-radius:var(--r-card)}
.st{display:grid;gap:2px;font-size:12px;line-height:16px;color:var(--mut);text-align:center}
.st b{font-weight:600;color:var(--text);font-size:13px}
.st .lv{color:var(--live);font-weight:700}
.teams,.dots,.sc{display:grid;gap:6px}
.tm{display:flex;align-items:center;gap:10px;min-width:0;height:24px}
.tm .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.tm.win .nm{font-weight:700}
.tm.lo .nm{color:var(--mut)}
.tm.tbd .nm{color:var(--mut)}
.dots > span{display:flex;gap:4px;height:24px;align-items:center;justify-content:flex-end}
.dots i,.big-dots i{width:8px;height:8px;border-radius:50%;background:var(--dot)}
.dots i.f,.big-dots i.f{background:var(--ink)}
.dots i.lv,.big-dots i.lv{background:var(--live)}
.dots i.new,.big-dots i.new{animation:pop .45s var(--ease)}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
.sc span{height:24px;line-height:24px;text-align:right;font-weight:700;font-size:16px}
.sc .lo{color:var(--mut);font-weight:500}
.row.run .sc span{color:var(--live)}

/* Avatars: team logos and player photos */
.av{position:relative;flex:none;width:24px;height:24px;border-radius:var(--r-av);display:grid;place-items:center;background:var(--plate);color:var(--mut);font-size:9px;font-weight:700;overflow:hidden}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:2px}
.av .ini{text-transform:uppercase}
.av.img .ini{visibility:hidden}
.av.img.lt{background:var(--plate-lt)}
.av.img.dk{background:var(--plate-dk)}
.av.img.md{background:transparent}

.empty{padding:48px 16px;text-align:center;color:var(--mut)}
.pick{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:12px 16px}
.pick label{font-weight:700}
.pick input{flex:1;min-width:180px;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:999px;padding:9px 16px;font:inherit}
.pick input:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
.empty p{margin:0 0 16px;font-size:17px;font-weight:600;color:var(--text)}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;background:var(--ink);color:var(--card);padding:10px 18px;border-radius:999px;font-weight:600;font-size:14px;text-decoration:none;transition:opacity .15s var(--ease)}
.btn:hover{opacity:.85}
.btn svg,.back svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.foot{max-width:1200px;margin:0 auto;padding:0 20px 32px;color:var(--mut);font-size:13px;line-height:18px}
.foot code{color:var(--text)}

/* Match page */
.back{display:inline-flex;align-items:center;gap:4px;padding:4px 0;color:var(--mut);text-decoration:none;font-weight:600;font-size:14px;transition:color .15s var(--ease)}
.back:hover{color:var(--text)}
.hero{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:start;gap:16px;padding:8px 24px 28px}
.side-t{display:grid;justify-items:center;gap:10px;text-align:center;min-width:0}
.side-t .av{width:64px;height:64px;border-radius:16px;font-size:16px}
.side-t .nm{font-weight:700;font-size:18px;line-height:22px;overflow-wrap:anywhere}
.side-t.lo .nm{color:var(--mut)}
.big-dots{display:flex;gap:6px}
.big-dots i{width:10px;height:10px}
.mid{display:grid;justify-items:center;gap:8px;padding-top:6px}
.mid .score{font-size:44px;line-height:48px;font-weight:700;letter-spacing:-.01em}
.mid .score .lo{color:var(--mut)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--bg);font-size:13px;font-weight:600;color:var(--mut)}
.pill.lv{background:var(--live-bg);color:var(--live)}
.pill.lv::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--live)}
.mid .fmt{font-size:13px;color:var(--mut)}
.mid .btn{margin-top:8px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:16px 16px 8px}
.sec-h h2{margin:0;font-size:15px;font-weight:700}
.sec-h span{font-size:13px;color:var(--mut)}
.gm{display:grid;grid-template-columns:minmax(0,1fr) 96px minmax(0,1fr);align-items:center;height:44px;padding:0 16px;border-top:1px solid var(--line)}
.gm .c{text-align:center;font-size:13px;color:var(--mut);font-weight:600}
.gm.run .c{color:var(--live)}
.gm.todo .c{color:var(--mut);font-weight:500;opacity:.7}
.half{display:grid;grid-template-columns:minmax(0,1fr) 120px;align-items:center;column-gap:10px}
.half.l{grid-template-columns:120px minmax(0,1fr)}
.trk{display:flex;align-items:center}
.half.l .trk{order:2;justify-content:flex-end}
.meta{display:flex;align-items:baseline;gap:8px;min-width:0;font-size:13px}
.half.l .meta{justify-content:flex-end}
.meta b{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta span{color:var(--mut);white-space:nowrap}
.bar{flex:none;height:8px;border-radius:999px;background:var(--ink)}
.mark{flex:none;width:10px;height:10px;border-radius:50%;background:var(--ink)}
.gm.run .mark{background:var(--live)}
.ros{display:grid;grid-template-columns:1fr 1fr}
.ros > div{padding:0 16px 12px}
.ros > div + div{border-left:1px solid var(--line)}
.ros h3{display:flex;align-items:center;gap:8px;margin:8px 0;font-size:14px;font-weight:700}
.pl{display:flex;align-items:center;gap:12px;padding:8px 0;border-top:1px solid var(--line)}
.pl .av{width:36px;height:36px;border-radius:50%}
.pl .tx{flex:1;min-width:0}
.pl .hn{display:block;font-weight:600}
.pl .rn{display:block;color:var(--mut);font-size:13px;line-height:18px}
.pl .nat{color:var(--mut);font-size:13px;font-weight:600}
.note{margin:0;padding:12px 16px 16px;color:var(--mut);font-size:13px;line-height:18px}

@media (prefers-reduced-motion:reduce){.dots i.new,.big-dots i.new{animation:none}*{transition:none!important}}
@media (max-width:899px){
  .hd-in{grid-template-columns:1fr auto;grid-template-areas:"logo status" "seg seg";height:auto;row-gap:10px;padding-top:12px;padding-bottom:12px}
  .logo{grid-area:logo}.status{grid-area:status}
  .seg{grid-area:seg;justify-self:stretch}
  .seg button{justify-content:center}
  .shell{grid-template-columns:1fr;padding:12px}
  .side{display:none}
  .chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -12px;padding:0 12px}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none;display:flex;gap:6px;border:1px solid var(--line);background:var(--card);padding:7px 14px;border-radius:999px;font-size:14px;font-weight:600}
  .chip .c{color:var(--mut);font-weight:500}
  .chip.z{color:var(--mut)}
  .chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--card)}
  .chip[aria-pressed="true"] .c{color:inherit;opacity:.7}
}
@media (max-width:560px){
  .row{grid-template-columns:52px minmax(0,1fr) auto 24px;column-gap:12px;padding:10px 12px}
  .th{padding:12px 12px 8px;flex-wrap:wrap}
  .hero{padding:4px 12px 20px;gap:8px}
  .side-t .av{width:52px;height:52px;border-radius:14px}
  .side-t .nm{font-size:15px;line-height:19px}
  .mid .score{font-size:34px;line-height:40px}
  .gm{grid-template-columns:minmax(0,1fr) 72px minmax(0,1fr);padding:0 12px}
  .half{grid-template-columns:minmax(0,1fr) 52px}
  .half.l{grid-template-columns:52px minmax(0,1fr)}
  .meta b{display:none}
  .ros{grid-template-columns:1fr}
  .ros > div + div{border-left:0;border-top:1px solid var(--line)}
}
</style>
</head>
<body>
<header class="hd"><div class="hd-in">
  <a class="logo" href="#" aria-label="Undercard, all matches"><svg viewBox="2 3 28 26" aria-hidden="true"><rect x="15" y="4" width="2" height="24" rx="1" fill="#ffd400"/><rect x="3" y="13" width="5" height="6" rx="1.5" fill="currentColor"/><rect x="9" y="13" width="5" height="6" rx="1.5" fill="#e5243b"/><rect x="18" y="13" width="5" height="6" rx="1.5" fill="#e5243b"/><rect x="24" y="13" width="5" height="6" rx="1.5" fill="currentColor" opacity=".25"/></svg><span>Undercard</span></a>
  <div class="seg" id="tabs" role="tablist" aria-label="Match status"></div>
  <div class="status" id="mode"></div>
</div></header>
<div class="shell">
  <aside class="side card" aria-label="Games"><h2>Games</h2><nav id="side"></nav></aside>
  <main id="list" aria-live="polite"></main>
</div>
<p class="foot" id="foot"></p>
<script>
const GAMES={"league-of-legends":"LoL","cs-go":"CS2","dota-2":"Dota 2","valorant":"Valorant","rl":"Rocket League",
  "ow":"Overwatch 2","kog":"Honor of Kings","starcraft-2":"StarCraft II","r6-siege":"Rainbow Six","pubg":"PUBG",
  "mlbb":"Mobile Legends","lol-wild-rift":"Wild Rift","fifa":"EA FC","cod-mw":"Call of Duty","starcraft-brood-war":"StarCraft BW",
  /* fighting games, from start.gg */
  "sf6":"Street Fighter 6","tekken-8":"Tekken 8","ssbu":"Smash Ultimate","ssbm":"Smash Melee","ggst":"Guilty Gear Strive",
  "mk1":"Mortal Kombat 1","2xko":"2XKO","fatal-fury":"Fatal Fury"};
const DAYS=[-1,0,1,2];  // yesterday to the day after tomorrow
const LOCAL=["localhost","127.0.0.1",""].includes(location.hostname);
/* FastAPI serves this page and the API from the same origin (locally and on Render). Only a page opened
   as a file or from another local dev server needs to point at the local API. ?api= overrides both. */
const API=new URLSearchParams(location.search).get("api")||
  (location.protocol==="file:"||(LOCAL&&location.port!=="8000")?"http://localhost:8000":location.origin);
const TZ=Intl.DateTimeFormat().resolvedOptions().timeZone;
let LIVE=[],DAY=[],V="live",G="all",demo=true,CUR=null,TEAM=localStorage.getItem("undercard.team")||"";
const SEEN=new Map();  // match id -> "s1|s2", to animate newly won games

/* Demo data, same shape as GET /matches */
const R=[
 ["league-of-legends","Demo League","Playoffs","running",-34,5,"best_of","Nova Esports","NOV","Iron Wolves","IRW",1,1],
 ["league-of-legends","Demo League","Playoffs","not_started",95,3,"best_of","Crimson Tide","CRT","Lunar Fox","LNF",null,null],
 ["league-of-legends","Demo League","Playoffs","finished",-310,3,"best_of","Sky Forge","SKF","Pale Owls","PLO",2,0],
 ["cs-go","Open Series","Group stage","running",-52,3,"best_of","Vortex","VTX","Static Void","STV",1,0],
 ["cs-go","Open Series","Group stage","finished",-200,3,"best_of","Red Mirage","RDM","Echo Unit","ECU",2,1],
 ["cs-go","Open Series","Group stage","not_started",1560,3,"best_of","Black Anchor","BLA","Zen Pack","ZNP",null,null],
 ["dota-2","Demo Cup","Quarterfinals","running",-70,5,"best_of","Titan Root","TTR","Glass Cannon","GLC",0,1],
 ["dota-2","Demo Cup","Quarterfinals","not_started",240,3,"best_of","Night Relay","NRL","Gold Harbor","GDH",null,null],
 ["valorant","Demo Masters","Swiss stage","finished",-120,3,"best_of","Ember Squad","EMB","Frost Cell","FRC",2,1],
 ["ow","Demo Champions","Playoffs","running",-95,4,"first_to","Pulse Drift","PLD","Neon Pact","NNP",2,3],
 ["rl","Demo Series","Final","not_started",150,7,"best_of","Apex Orbit","APX","Rift Garage","RFG",null,null]
].map((r,i)=>{const[vg,lg,tn,st,off,bo,mt,n1,a1,n2,a2,s1,s2]=r;
 const w=st==="finished"?(s1>s2?i*2+1:i*2+2):null;
 return{id:i+1,videogame:vg,name:n1+" vs "+n2,status:st,league_name:lg,tournament_name:tn,
  scheduled_at:new Date(Date.now()+off*6e4).toISOString(),number_of_games:bo,match_type:mt,
  team1:{id:i*2+1,name:n1,acronym:a1},team2:{id:i*2+2,name:n2,acronym:a2},
  team1_score:s1,team2_score:s2,winner_id:w}});

const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const gname=s=>GAMES[s]||s;
const inGame=m=>G==="all"||m.videogame===G;
const view=()=>V==="live"?LIVE:DAY;
const dayStart=off=>{const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()+off);return d};
const dayLabel=off=>off===-1?"Yesterday":off===0?"Today":off===1?"Tomorrow":dayStart(off).toLocaleDateString("en-GB",{weekday:"short",day:"numeric"});
const inDay=(m,off)=>{const t=new Date(m.scheduled_at);return t>=dayStart(off)&&t<dayStart(off+1)};
const base=()=>API.replace(/\/$/,"");
const safeUrl=u=>/^https?:\/\//i.test(u||"")?u:null;
/* first_to (Overwatch): number_of_games = wins needed; best_of: series length */
const need=m=>m.match_type==="first_to"?(m.number_of_games||1):Math.ceil((m.number_of_games||3)/2);
const fmt=m=>m.match_type==="first_to"?`First to ${m.number_of_games||"?"}`:`Best of ${m.number_of_games||"?"}`;
const STATUS={canceled:"Canceled",postponed:"Postponed"};
const ICON={
  back:`<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3.5 5.5 8l4.5 4.5"/></svg>`,
  out:`<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3.5h6.5V10M12.5 3.5 4 12"/></svg>`};

function when(iso){
  if(!iso)return["",""];
  const d=new Date(iso),n=new Date();
  const diff=Math.round((new Date(d.getFullYear(),d.getMonth(),d.getDate())-new Date(n.getFullYear(),n.getMonth(),n.getDate()))/864e5);
  const day=diff===0?"Today":diff===1?"Tomorrow":diff===-1?"Yesterday":d.toLocaleDateString("en-GB",{day:"numeric",month:"short"});
  return[day,d.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"})];
}
function eta(iso){
  const mins=Math.round((new Date(iso)-Date.now())/6e4);
  if(mins<1)return"Starting";
  if(mins<60)return`In ${mins} min`;
  return null;
}
const initials=t=>(t.acronym||t.name||"?").slice(0,3);
const av=t=>`<span class="av${t.image_url?" img":""}"><span class="ini">${esc(initials(t))}</span>${t.image_url?`<img src="${esc(t.image_url)}" alt="" loading="lazy" crossorigin="anonymous" onload="tone(this)" onerror="this.parentNode.classList.remove('img');this.remove()">`:""}</span>`;

/* Pick a plate a logo can be read on (PandaScore's CDN allows CORS reads) */
const TONE=new Map();
function tone(img){
  const apply=t=>t&&img.parentNode&&img.parentNode.classList.add(t);
  if(TONE.has(img.src))return apply(TONE.get(img.src));
  try{
    const c=document.createElement("canvas");c.width=c.height=24;
    const x=c.getContext("2d",{willReadFrequently:true});x.drawImage(img,0,0,24,24);
    const d=x.getImageData(0,0,24,24).data;let sum=0,n=0;
    for(let i=0;i<d.length;i+=4){if(d[i+3]<128)continue;sum+=(.2126*d[i]+.7152*d[i+1]+.0722*d[i+2])/255;n++}
    const l=n?sum/n:.5,t=l<.45?"dk":l>.75?"lt":"md";  // only extreme marks need a contrasting tile
    TONE.set(img.src,t);apply(t);
  }catch{TONE.set(img.src,"")}
}

/* Series dots: one per game to win; red marks the game in play */
function dots(m,score,fresh){
  const n=need(m),live=m.status==="running",s=score||0;
  let out="";
  for(let i=0;i<n;i++){
    const cls=i<s?"f"+(fresh&&i===s-1?" new":""):live&&i===s?"lv":"";
    out+=`<i${cls?` class="${cls}"`:""}></i>`;
  }
  return out;
}
function freshness(m){
  const prev=SEEN.get(m.id);SEEN.set(m.id,`${m.team1_score}|${m.team2_score}`);
  if(!prev)return[false,false];
  const[p1,p2]=prev.split("|").map(Number);
  return[m.team1_score>p1,m.team2_score>p2];
}
function label(m){
  const a=m.team1?.name||"TBD",b=m.team2?.name||"TBD";
  if(m.status==="running")return`${a} ${m.team1_score??0}, ${b} ${m.team2_score??0}, live, ${fmt(m)}`;
  if(m.status==="finished")return`${a} ${m.team1_score??0}, ${b} ${m.team2_score??0}, final`;
  const[day,time]=when(m.scheduled_at);
  return`${a} versus ${b}, ${STATUS[m.status]||day+" "+time}, ${fmt(m)}`;
}
function statusCell(m){
  const[day,time]=when(m.scheduled_at),start=when(m.begin_at||m.scheduled_at)[1];
  if(m.status==="running")return`<span class="lv">Live</span><span>Game ${(m.team1_score||0)+(m.team2_score||0)+1}</span><span class="num">${start}</span>`;
  const d=V==="live"||V==="team"?day:"";  // a day tab already says which day it is
  if(m.status==="finished")return`<b>Final</b><span class="num">${d?d+" ":""}${start}</span>`;
  if(STATUS[m.status])return`<b>${STATUS[m.status]}</b><span>${d}</span>`;
  return`<b class="num">${time}</b><span>${eta(m.scheduled_at)||d}</span>`;
}
function row(m){
  const fin=m.status==="finished",scored=m.status==="running"||fin;
  const w1=fin&&m.winner_id===m.team1?.id,w2=fin&&m.winner_id===m.team2?.id;
  const[f1,f2]=freshness(m);
  const tm=(t,w)=>t?`<span class="tm ${fin?(w?"win":"lo"):""}">${av(t)}<span class="nm">${esc(t.name)}</span></span>`
    :`<span class="tm tbd"><span class="av">?</span><span class="nm">TBD</span></span>`;
  const sc=scored?`<span class="${fin&&!w1?"lo":""}">${m.team1_score??0}</span><span class="${fin&&!w2?"lo":""}">${m.team2_score??0}</span>`:"";
  return`<a class="row ${m.status==="running"?"run":""}" href="#/match/${m.id}" aria-label="${esc(label(m))}">
    <span class="st">${statusCell(m)}</span>
    <span class="teams">${tm(m.team1,w1)}${tm(m.team2,w2)}</span>
    <span class="dots" aria-hidden="true"><span>${dots(m,scored?m.team1_score:0,f1)}</span><span>${dots(m,scored?m.team2_score:0,f2)}</span></span>
    <span class="sc num">${sc}</span></a>`;
}

function renderNav(){
  const data=view();
  const slugs=[...new Set(data.map(m=>m.videogame))].sort((a,b)=>gname(a).localeCompare(gname(b),"en"));
  const items=[["all","All games"],...slugs.map(s=>[s,gname(s)])].map(([s,l])=>[s,l,data.filter(m=>s==="all"||m.videogame===s).length]);
  document.getElementById("side").innerHTML=items.map(([s,l,c])=>
    `<button class="nav ${c?"":"z"}" aria-pressed="${G===s}" data-g="${esc(s)}"><span>${esc(l)}</span><span class="c num">${c}</span></button>`).join("");
  const liveN=LIVE.filter(inGame).length;
  document.getElementById("tabs").innerHTML=
    `<button role="tab" aria-selected="${!CUR&&V==="live"}" data-v="live">${liveN?'<span class="dot" aria-hidden="true"></span>':""}Live<span class="c num">${liveN}</span></button>`+
    `<button role="tab" aria-selected="${!CUR&&V==="team"}" data-v="team">My team</button>`+
    DAYS.map(o=>`<button role="tab" aria-selected="${!CUR&&V===o}" data-v="${o}">${dayLabel(o)}</button>`).join("");
  CHIPS=`<div class="chips" role="group" aria-label="Filter by game">${items.map(([s,l,c])=>
    `<button class="chip ${c?"":"z"}" aria-pressed="${G===s}" data-g="${esc(s)}">${esc(l)}<span class="c num">${c}</span></button>`).join("")}</div>`;
}
let CHIPS="";
function renderList(){
  const ms=view().filter(inGame);
  const el=document.getElementById("list");
  const top=(V==="team"?PICK():"")+CHIPS;
  if(!ms.length){
    const msg=V==="live"?"No live matches right now"
      :V==="team"?(TEAM?`No matches for ${esc(TEAM)} in the last 30 days`:"Choose a team to follow its matches in every game")
      :`No matches ${V===0?"today":V===1?"tomorrow":V===-1?"yesterday":"on this day"}${G==="all"?"":` for ${gname(G)}`}`;
    const go=V==="live"?`<button class="btn" data-v="0">See today's matches</button>`:G!=="all"?`<button class="btn" data-g="all">Show all games</button>`:"";
    el.innerHTML=top+`<div class="card empty"><p>${msg}</p>${go}</div>`;
    return;
  }
  const key=m=>m.videogame+"|"+m.league_name+"|"+m.tournament_name;
  const t=m=>new Date(m.scheduled_at);
  const sorted=[...ms].sort((a,b)=>V==="team"?t(b)-t(a):t(a)-t(b));  // a team's history reads newest first
  const groups=new Map();  // insertion order follows time, so tournaments appear by their first match
  sorted.forEach(m=>{if(!groups.has(key(m)))groups.set(key(m),[]);groups.get(key(m)).push(m)});
  el.innerHTML=top+[...groups.values()].map(list=>{
    const f=list[0],same=list.every(m=>fmt(m)===fmt(f));
    return`<section class="card" aria-label="${esc(f.league_name)}"><div class="th"><span class="lg">${esc(f.league_name)}${f.tournament_name?`<span>${esc(f.tournament_name)}</span>`:""}</span><span class="rt"><span>${esc(gname(f.videogame))}</span>${same?`<span>${fmt(f)}</span>`:""}</span></div>`+
      list.map(row).join("")+`</section>`}).join("");
}
function render(){renderNav();if(CUR)showMatch(CUR,false);else renderList()}
const PICK=()=>`<form class="card pick" id="pick"><label for="team-q">My team</label>
  <input id="team-q" list="team-list" value="${esc(TEAM)}" placeholder="Search a team, e.g. Team Liquid" autocomplete="off">
  <datalist id="team-list"></datalist><button class="btn">Show matches</button></form>`;
document.addEventListener("submit",async e=>{
  if(e.target.id!=="pick")return;
  e.preventDefault();
  TEAM=document.getElementById("team-q").value.trim();
  localStorage.setItem("undercard.team",TEAM);
  await loadDay();render();
});
document.addEventListener("input",async e=>{
  const q=e.target.id==="team-q"?e.target.value.trim():"";
  if(q.length<2)return;
  let names;
  try{names=demo?[...new Set(R.flatMap(m=>[m.team1.name,m.team2.name]))].filter(n=>n.toLowerCase().includes(q.toLowerCase()))
    :await(await fetch(base()+"/teams?q="+encodeURIComponent(q))).json()}catch{return}
  document.getElementById("team-list").innerHTML=names.map(n=>`<option value="${esc(n)}">`).join("");
});

document.addEventListener("click",async e=>{
  const g=e.target.closest("[data-g]"),v=e.target.closest("[data-v]");
  if(g)G=g.dataset.g;
  if(v){const x=v.dataset.v;V=x==="live"||x==="team"?x:+x;await loadDay()}
  if(g||v){if(CUR)location.hash="";else render()}
});

/* Match page: #/match/<id> */
const BACK=`<a class="back" href="#">${ICON.back}All matches</a>`;
const mins=sec=>sec?`${Math.round(sec/60)} min`:"";
function route(){
  const id=+((location.hash.match(/^#\/match\/(-?\d+)$/)||[])[1]||0);  // start.gg ids are negative
  CUR=id||null;
  renderNav();
  if(CUR)showMatch(CUR,true);else{renderList();document.title="Undercard"}
}
async function showMatch(id,top){
  let m=null;
  if(!demo){try{const r=await fetch(base()+"/matches/"+id);if(r.ok)m=await r.json()}catch{}}
  m=m||[...LIVE,...DAY,...(demo?R:[])].find(x=>x.id===id);
  if(CUR!==id)return;
  document.getElementById("list").innerHTML=m?renderDetail(m):`${BACK}<div class="card empty"><p>Match not found</p></div>`;
  document.title=m?`${m.team1?.name||"TBD"} vs ${m.team2?.name||"TBD"} · Undercard`:"Undercard";
  if(top)window.scrollTo(0,0);
}
function renderDetail(m){
  const live=m.status==="running",fin=m.status==="finished",scored=live||fin;
  const w1=fin&&m.winner_id===m.team1?.id,w2=fin&&m.winner_id===m.team2?.id;
  const[f1,f2]=freshness(m);
  const[day,time]=when(m.scheduled_at),started=when(m.begin_at||m.scheduled_at);
  const stream=safeUrl(m.stream_url);
  const team=(t,lose,score,fresh)=>t
    ?`<div class="side-t ${lose?"lo":""}">${av(t)}<span class="nm">${esc(t.name)}</span><span class="big-dots" aria-hidden="true">${dots(m,scored?score:0,fresh)}</span></div>`
    :`<div class="side-t"><span class="av">?</span><span class="nm">TBD</span></div>`;
  const center=scored
    ?`<span class="score num"><span class="${fin&&!w1?"lo":""}">${m.team1_score??0}</span> – <span class="${fin&&!w2?"lo":""}">${m.team2_score??0}</span></span>${live?`<span class="pill lv">Live, game ${(m.team1_score||0)+(m.team2_score||0)+1}</span>`:`<span class="pill">Final</span>`}`
    :`<span class="score num">${STATUS[m.status]?"–":time}</span><span class="pill">${STATUS[m.status]||eta(m.scheduled_at)||day}</span>`;
  let html=`${BACK}<section class="card"><div class="th"><span class="lg">${esc(m.league_name)}${m.tournament_name?`<span>${esc(m.tournament_name)}</span>`:""}</span><span class="rt"><span>${esc(gname(m.videogame))}</span></span></div>
  <div class="hero">${team(m.team1,fin&&!w1,m.team1_score,f1)}<div class="mid">${center}<span class="fmt">${fmt(m)}${scored?`, started ${started[0]==="Today"?"":started[0]+" "}${started[1]}`:""}</span>${stream?`<a class="btn" href="${esc(stream)}" target="_blank" rel="noopener noreferrer">Watch stream${ICON.out}</a>`:""}</div>${team(m.team2,fin&&!w2,m.team2_score,f2)}</div></section>`;
  if(!m.games)return html+`<p class="foot" style="padding:0">Games and rosters appear when the API is connected.</p>`;
  const maxGames=m.match_type==="first_to"?2*(m.number_of_games||1)-1:(m.number_of_games||m.games.length);
  const games=m.games.filter(g=>g.position<=maxGames&&!(fin&&g.status==="not_started"));
  if(games.length){
    const won=games.filter(g=>g.winner_id);
    const timed=won.length>0&&won.every(g=>g.length);  // bars only when every duration is real
    const longest=Math.max(...won.map(g=>g.length||0),1);
    const lane=(side,mark,meta="")=>{
      const trk=`<span class="trk">${mark}</span>`,mt=`<span class="meta">${meta}</span>`;
      return`<span class="half ${side}">${side==="l"?mt+trk:trk+mt}</span>`};
    const half=(t,side,g)=>{
      if(!t||g.winner_id!==t.id)return lane(side,"");
      const mark=timed?`<span class="bar" style="width:${Math.max(4,Math.round(g.length/longest*100))}%"></span>`:`<span class="mark"></span>`;
      const who=`<b>${esc(t.acronym||t.name)}</b>`,len=g.length?`<span>${mins(g.length)}</span>`:"";
      return lane(side,mark,side==="l"?len+who:who+len)};
    html+=`<section class="card"><div class="sec-h"><h2>Game by game</h2>${timed?"<span>Bar length is game duration</span>":""}</div>`+games.map(g=>{
      const run=g.status==="running",todo=!g.winner_id&&!run;
      const c=run?`Game ${g.position}, live`:todo?`Game ${g.position}, not played`:`Game ${g.position}`;
      const live=`<span class="mark"></span>`;
      const l1=run?lane("l",live):half(m.team1,"l",g);
      const l2=run?lane("r",live):half(m.team2,"r",g);
      return`<div class="gm ${run?"run":""} ${todo?"todo":""}">${l1}<span class="c" aria-label="${c}">Game ${g.position}</span>${l2}</div>`}).join("")+`</section>`;
  }
  const roster=t=>t?`<div><h3>${av(t)}${esc(t.name)}</h3>${(t.players||[]).length?t.players.map(p=>{
      const sub=[[p.first_name,p.last_name].filter(Boolean).join(" "),p.role].filter(Boolean).map(esc).join(", ");
      return`<div class="pl">${av({name:p.name,image_url:p.image_url})}<span class="tx"><span class="hn">${esc(p.name)}</span>${sub?`<span class="rn">${sub}</span>`:""}</span><span class="nat">${esc(p.nationality)}</span></div>`}).join("")
    :`<p class="note" style="padding:8px 0">Roster not synced yet.</p>`}</div>`:"";
  if(m.source!=="startgg"&&(m.team1||m.team2))html+=`<section class="card"><div class="sec-h"><h2>Rosters</h2></div><div class="ros">${roster(m.team1)}${roster(m.team2)}</div><p class="note">Current team rosters, not necessarily the lineup for this match.</p></section>`;
  return html;
}

async function getMatches(query){const r=await fetch(base()+"/matches?"+query);if(!r.ok)throw 0;return r.json()}
async function loadLive(){LIVE=demo?R.filter(m=>m.status==="running"):await getMatches("status=running&limit=200")}
async function loadDay(){
  if(V==="live")return;
  if(V==="team"){
    const mine=m=>[m.team1?.name,m.team2?.name].some(n=>n&&n.toLowerCase()===TEAM.toLowerCase());
    DAY=!TEAM?[]:demo?R.filter(mine):await getMatches(new URLSearchParams({team:TEAM,limit:"500"}));
    return;
  }
  const q=new URLSearchParams({since:dayStart(V).toISOString(),until:dayStart(V+1).toISOString(),limit:"500"});
  DAY=demo?R.filter(m=>inDay(m,V)):await getMatches(q);
}
async function init(){
  document.getElementById("list").innerHTML=`<div class="card empty"><p>Loading matches</p></div>`;
  demo=!API;
  if(API){try{await loadLive()}catch{demo=true}}
  if(demo)await loadLive();
  V=LIVE.length?"live":0;
  try{await loadDay()}catch{}
  document.getElementById("mode").textContent=demo?"Demo data":"";
  document.getElementById("foot").innerHTML=(demo?(LOCAL?"Local API not found: run <code>uvicorn app.main:app</code> in the backend folder, then reload. ":"To use your API, add <code>?api=http://localhost:8000</code> to this page address. "):"")+"Times shown in "+esc(TZ)+". Data from PandaScore and start.gg.";
  addEventListener("hashchange",route);
  route();
  setInterval(demo?simulate:refresh,demo?7000:30000);
}
/* Demo: advance live scores */
function simulate(){
  const live=R.filter(m=>m.status==="running");
  const m=live[Math.floor(Math.random()*live.length)];
  if(!m)return;
  const k=Math.random()<.5?"team1_score":"team2_score";
  if(m[k]+1>=need(m))return;
  m[k]++;render();
}
async function refresh(){if(document.activeElement?.id==="team-q")return;try{await loadLive();await loadDay();render()}catch{}}
init();
</script>
</body>
</html>
