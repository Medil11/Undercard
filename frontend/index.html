<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#191c22" media="(prefers-color-scheme: dark)">
<title>Undercard</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preload" href="fonts/archivo-latin.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:"Archivo";font-style:normal;font-weight:100 900;font-display:swap;src:url("fonts/archivo-latin.woff2") format("woff2");unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD}
@font-face{font-family:"Archivo";font-style:normal;font-weight:100 900;font-display:swap;src:url("fonts/archivo-latin-ext.woff2") format("woff2");unicode-range:U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF}
@font-face{font-family:"Unbounded";font-style:normal;font-weight:600;font-display:swap;src:url("fonts/unbounded-600-latin.woff2") format("woff2");unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD}
:root{
  --bg:#eef1f5;--card:#fff;--ink:#1d2026;--text:#1d2026;--mut:#6a717d;--line:#e7eaef;--hover:#f5f7fa;
  --live:#e5243b;--live-bg:#fdecee;--dot:#d9dde3;
  --plate:#e9ecf0;--plate-lt:#1d2026;--plate-dk:transparent;
  --r-card:16px;--r-av:8px;
  --font:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --ease:cubic-bezier(.16,1,.3,1);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f1115;--card:#191c22;--ink:#eceef1;--text:#eceef1;--mut:#9aa1ad;--line:#262a31;--hover:#20242b;
  --live:#ff4d5e;--live-bg:rgba(255,77,94,.14);--dot:#353a43;
  --plate:#2a2f37;--plate-lt:transparent;--plate-dk:#e9ecf0;
  color-scheme:dark;
}}
*,*::before,*::after{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--text);font:400 15px/20px var(--font);-webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom,0px)}
::selection{background:var(--ink);color:var(--card)}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* Header */
.hd{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.hd-in{max-width:1200px;margin:0 auto;padding:0 20px;height:60px;display:grid;grid-template-columns:auto 1fr auto;align-items:center;column-gap:32px}
.logo{display:flex;align-items:center;gap:8px;text-decoration:none;font-family:"Unbounded",var(--font);font-weight:600;font-size:18px;letter-spacing:-.01em}
.logo svg{width:26px;height:24px;flex:none}
.seg{display:inline-flex;gap:4px;padding:4px;background:var(--card);border-radius:999px;justify-self:start;max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg[hidden]{display:none}
.seg button{flex:none;white-space:nowrap}
.seg button{display:flex;align-items:center;gap:6px;border:0;background:none;padding:6px 14px;border-radius:999px;font-weight:600;font-size:14px;color:var(--mut);transition:background-color .15s var(--ease),color .15s var(--ease)}
.seg button:hover{color:var(--text)}
.seg button[aria-selected="true"]{background:var(--ink);color:var(--card)}
.seg .c{font-weight:500;opacity:.7}
.seg .dot{width:6px;height:6px;border-radius:50%;background:var(--live)}
.status{display:flex;gap:8px;justify-content:flex-end}
.tools{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.tools[hidden]{display:none}
.mine{display:inline-flex;align-items:center;gap:6px}
.mine .c{font-weight:500;opacity:.7}
.mine svg,.star svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linejoin:round}
.mine[aria-pressed="true"] svg,.star[aria-pressed="true"] svg{fill:currentColor}
.star{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:none;padding:6px 14px;border-radius:999px;font-weight:600;font-size:14px}
.star:hover{background:var(--hover)}
.star[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--card)}
.phead{display:flex;align-items:center;gap:16px;padding:16px}
.phead .av{width:64px;height:64px;border-radius:16px;font-size:16px;flex:none}
.phead .lgi{width:40px;height:40px;margin:0;vertical-align:0}
.phead .tx{flex:1;min-width:0}
.phead h1{margin:0;font-size:22px;line-height:28px}
.phead .sub{color:var(--mut);font-size:14px;display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:2px}
.phead .sub a{color:inherit}
.side-t a.nm,.ros h3 a,.stand .tm a,a.pl{color:inherit;text-decoration:none}
.side-t a.nm:hover,.ros h3 a:hover,.stand .tm a:hover,a.pl:hover .hn{text-decoration:underline}
.favs{display:flex;flex-wrap:wrap;gap:8px;padding:0 16px 16px}
.fav{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:4px 6px 4px 4px;font-size:14px;font-weight:600}
.fav a{display:inline-flex;align-items:center;gap:8px;color:inherit;text-decoration:none}
.fav .av{width:24px;height:24px;font-size:9px;border-radius:50%}
.fav .lgi{margin:0 0 0 4px;vertical-align:0}
.fav button{border:0;background:none;color:var(--mut);padding:2px 6px;border-radius:999px;font-size:13px}
.fav button:hover{background:var(--hover);color:var(--text)}
.sec{display:flex;align-self:stretch;gap:4px}
.sec a{display:flex;align-items:center;gap:8px;padding:0 16px;text-decoration:none;font-weight:700;font-size:14px;color:var(--mut);border-bottom:3px solid transparent;transition:color .15s var(--ease)}
.sec a:hover{color:var(--text)}
.sec a[aria-current="page"]{color:var(--text);border-bottom-color:var(--ink)}
.sec svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linejoin:round}
.gbar{border-top:1px solid var(--line)}
.gbar-in{padding:0 8px;display:flex;overflow-x:auto;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.gbar-in::-webkit-scrollbar{height:6px}
.gbar-in::-webkit-scrollbar-thumb{background:var(--line);border-radius:999px}
.gbar-in::-webkit-scrollbar-thumb:hover{background:var(--mut)}
.gbar button{flex:1 0 auto;display:flex;align-items:center;justify-content:center;gap:8px;border:0;background:none;padding:12px 12px 9px;font-weight:700;font-size:13px;color:var(--mut);border-bottom:3px solid transparent;white-space:nowrap;transition:color .15s var(--ease)}
.gbar button:hover{color:var(--text)}
.gbar button[aria-pressed="true"]{color:var(--text);border-bottom-color:var(--ink)}
.gbar .c{font-weight:500;opacity:.7}
.gbar button.z{opacity:.55}  /* every game is listed, even with nothing today */
.gbar .gi{width:18px;height:18px}
.news .nw{display:grid;grid-template-columns:132px minmax(0,1fr);gap:16px;align-items:center;padding:12px 16px;text-decoration:none;border-top:1px solid var(--line)}
.news .nw:first-child{border-top:0}
.news .nw.noimg{grid-template-columns:minmax(0,1fr)}
.news .nw:hover .t{text-decoration:underline}
.news .pic{width:132px;height:74px;object-fit:cover;border-radius:10px;background:var(--bg)}
.news .t{display:block;font-weight:700;line-height:20px}
.news .sm{margin-top:4px;color:var(--mut);font-size:13px;line-height:18px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.news .mt{display:flex;align-items:center;gap:6px;margin-top:6px;color:var(--mut);font-size:12px;font-weight:600}
.mine{border:1px solid var(--line);background:none;padding:6px 14px;border-radius:999px;font-weight:600;font-size:14px;transition:background-color .15s var(--ease)}
.mine:hover{background:var(--hover)}
.mine[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--card)}

/* Layout */
.shell{max-width:1160px;margin:0 auto;padding:20px;display:grid;grid-template-columns:minmax(0,880px);justify-content:center;gap:20px;align-items:start}
.shell.wide{grid-template-columns:240px minmax(0,880px)}
.col{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;min-width:0}
.side{position:sticky;top:128px;padding:8px;max-height:calc(100vh - 148px);overflow-y:auto}
.side[hidden]{display:none}
.side h2{margin:8px 12px 6px;font-size:13px;font-weight:600;color:var(--mut)}
.lg-b{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:8px 12px;border-radius:10px;text-align:left;font-size:14px;font-weight:500;transition:background-color .15s var(--ease)}
.lg-b:hover{background:var(--hover)}
.lg-b[aria-pressed="true"]{background:var(--bg);font-weight:700}
.lg-b .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lg-b .c{color:var(--mut);font-weight:500}
.lg-b .lgi{margin:0;vertical-align:0;flex:none}
@media (prefers-color-scheme:dark){.lgi{background:#fff;border-radius:4px;padding:1px}}  /* black league marks */
.lg-b .ph{width:18px;height:18px;flex:none;border-radius:5px;background:var(--bg)}
.card{background:var(--card);border-radius:var(--r-card);overflow:hidden}
.gn{display:flex;align-items:center;gap:8px}
.gi{width:16px;height:16px;border-radius:4px;flex:none}
@media (prefers-color-scheme:dark){.gi{background:#fff;padding:1px}}  /* some marks (Smash) are black */
main{display:grid;gap:16px;min-width:0}

/* Tournament card + match rows */
.th{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:14px 16px 10px}
.th .lg{font-weight:700;font-size:14px;min-width:0}
.th .lg span{font-weight:500;color:var(--mut);margin-left:6px}
.lgi{width:18px;height:18px;object-fit:contain;vertical-align:-4px;margin-right:8px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin:0;padding:0 16px 16px}
.facts dt{font-size:13px;color:var(--mut)}
.facts dd{margin:2px 0 0;font-weight:600}
.stand{width:100%;border-collapse:collapse;font-size:14px}
.stand th{text-align:left;font-size:13px;font-weight:500;color:var(--mut);padding:0 16px 8px}
.stand td{padding:8px 16px;border-top:1px solid var(--line);vertical-align:middle}
.stand td:first-child,.stand th:first-child{width:32px;text-align:center}
.stand tr.me td{background:var(--bg);font-weight:700}
.stand .tm{display:flex;align-items:center;gap:10px}
.stand .tm .av{width:24px;height:24px;font-size:9px}
.stand a{color:inherit;text-decoration:none}
.stand a:hover{text-decoration:underline}
.res{display:inline-block;width:20px;margin-right:8px;text-align:center;border-radius:6px;font-size:12px}
.res.W{background:var(--ink);color:var(--card)}
.res.L{color:var(--mut)}
.th .rt{display:flex;gap:12px;flex:none;font-size:13px;color:var(--mut)}
.row{display:grid;grid-template-columns:64px minmax(0,1fr) auto 28px;column-gap:16px;align-items:center;padding:10px 16px;border-top:1px solid var(--line);text-decoration:none;transition:background-color .15s var(--ease)}
a.row:hover{background:var(--hover)}
a.row:focus-visible{outline-offset:-2px;border-radius:var(--r-card)}
.st{display:grid;gap:2px;font-size:12px;line-height:16px;color:var(--mut);text-align:center}
.st b{font-weight:600;color:var(--text);font-size:13px}
.st .lv{color:var(--live);font-weight:700}
.teams,.dots,.sc{display:grid;gap:6px}
.tm{display:flex;align-items:center;gap:10px;min-width:0;height:24px}
.tm .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.tm.win .nm{font-weight:700}
.tm.lo .nm{color:var(--mut)}
.tm.tbd .nm{color:var(--mut)}
.dots > span{display:flex;gap:4px;height:24px;align-items:center;justify-content:flex-end}
.dots i,.big-dots i{width:8px;height:8px;border-radius:50%;background:var(--dot)}
.dots i.f,.big-dots i.f{background:var(--ink)}
.dots i.lv,.big-dots i.lv{background:var(--live)}
.dots i.new,.big-dots i.new{animation:pop .45s var(--ease)}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
.sc span{height:24px;line-height:24px;text-align:right;font-weight:700;font-size:16px}
.sc .lo{color:var(--mut);font-weight:500}
.row.run .sc span{color:var(--live)}

/* Avatars: team logos and player photos */
.av{position:relative;flex:none;width:24px;height:24px;border-radius:var(--r-av);display:grid;place-items:center;background:var(--plate);color:var(--mut);font-size:9px;font-weight:700;overflow:hidden}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:2px}
.av .ini{text-transform:uppercase}
.av.img .ini{visibility:hidden}
.av.img.lt{background:var(--plate-lt)}
.av.img.dk{background:var(--plate-dk)}
.av.img.md{background:transparent}

.empty{padding:48px 16px;text-align:center;color:var(--mut)}
.pick{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:12px 16px;overflow:visible}  /* let the suggestions spill out of the card */
.pick label{font-weight:700}
.pick-in{position:relative;flex:1;min-width:180px;display:flex}
.sugg{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:4;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden auto;max-height:320px;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.sugg:empty{display:none}
.sugg button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:8px 14px;text-align:left;font-weight:500}
.sugg button:hover,.sugg button:focus-visible{background:var(--hover);outline:0}
.sugg .none{display:block;padding:10px 14px;color:var(--mut)}
.pick input{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:999px;padding:9px 16px;font:inherit}
.pick input:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
.empty p{margin:0 0 16px;font-size:17px;font-weight:600;color:var(--text)}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;background:var(--ink);color:var(--card);padding:10px 18px;border-radius:999px;font-weight:600;font-size:14px;text-decoration:none;transition:opacity .15s var(--ease)}
.btn:hover{opacity:.85}
.btn svg,.back svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.foot{max-width:1200px;margin:0 auto;padding:0 20px 32px;color:var(--mut);font-size:13px;line-height:18px}
.foot code{color:var(--text)}

/* Match page */
.back{display:inline-flex;align-items:center;gap:4px;padding:4px 0;border:0;background:none;justify-self:start;color:var(--mut);text-decoration:none;font-weight:600;font-size:14px;transition:color .15s var(--ease)}
.back:hover{color:var(--text)}
.hero{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:start;gap:16px;padding:8px 24px 28px}
.side-t{display:grid;justify-items:center;gap:10px;text-align:center;min-width:0}
.side-t .av{width:64px;height:64px;border-radius:16px;font-size:16px}
.side-t .nm{font-weight:700;font-size:18px;line-height:22px;overflow-wrap:anywhere}
.side-t.lo .nm{color:var(--mut)}
.big-dots{display:flex;gap:6px}
.big-dots i{width:10px;height:10px}
.mid{display:grid;justify-items:center;gap:8px;padding-top:6px}
.mid .score{font-size:44px;line-height:48px;font-weight:700;letter-spacing:-.01em}
.mid .score .lo{color:var(--mut)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--bg);font-size:13px;font-weight:600;color:var(--mut)}
.pill.lv{background:var(--live-bg);color:var(--live)}
.pill.lv::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--live)}
.mid .fmt{font-size:13px;color:var(--mut)}
.mid .btn{margin-top:8px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:16px 16px 8px}
.sec-h h2{margin:0;font-size:15px;font-weight:700}
.picks{padding:0 8px 8px}
.tv-c{padding:12px}
.tv{display:block;width:100%;max-width:480px;margin:0 auto;aspect-ratio:16/9;border:0;border-radius:10px;background:#000}
.bk-wrap{overflow-x:auto;padding:0 16px 16px}
.bk-wrap h3{margin:8px 0;font-size:13px;font-weight:600;color:var(--mut)}
.bk{display:flex;gap:16px;width:max-content}
.bk-col{display:flex;flex-direction:column;justify-content:space-around;gap:8px;width:184px}
.bk-m{display:block;border:1px solid var(--line);border-radius:10px;color:inherit;text-decoration:none;transition:background-color .15s var(--ease)}
.bk-m:hover{background:var(--hover)}
.bk-m.me{border-color:var(--ink)}
.bk-m.run{border-color:var(--live)}
.bk-t{display:flex;align-items:center;gap:8px;padding:6px 8px;font-size:13px}
.bk-t+.bk-t{border-top:1px solid var(--line)}
.bk-t .av{width:18px;height:18px;font-size:8px;flex:none}
.bk-t .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.bk-t.lo{color:var(--mut)}.bk-t.lo .n{font-weight:500}
.sec-h span{font-size:13px;color:var(--mut)}
.gm{display:grid;grid-template-columns:minmax(0,1fr) 96px minmax(0,1fr);align-items:center;height:44px;padding:0 16px;border-top:1px solid var(--line)}
.gm .c{text-align:center;font-size:13px;color:var(--mut);font-weight:600}
.gm.run .c{color:var(--live)}
.gm.todo .c{color:var(--mut);font-weight:500;opacity:.7}
.half{display:grid;grid-template-columns:minmax(0,1fr) 120px;align-items:center;column-gap:10px}
.half.l{grid-template-columns:120px minmax(0,1fr)}
.trk{display:flex;align-items:center}
.half.l .trk{order:2;justify-content:flex-end}
.meta{display:flex;align-items:baseline;gap:8px;min-width:0;font-size:13px}
.half.l .meta{justify-content:flex-end}
.meta b{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta span{color:var(--mut);white-space:nowrap}
.bar{flex:none;height:8px;border-radius:999px;background:var(--ink)}
.mark{flex:none;width:10px;height:10px;border-radius:50%;background:var(--ink)}
.gm.run .mark{background:var(--live)}
.ros{display:grid;grid-template-columns:1fr 1fr}
.ros > div,.ros1{padding:0 16px 12px}
.ros > div + div{border-left:1px solid var(--line)}
.ros h3{display:flex;align-items:center;gap:8px;margin:8px 0;font-size:14px;font-weight:700}
.pl{display:flex;align-items:center;gap:12px;padding:8px 0;border-top:1px solid var(--line)}
.pl .av{width:36px;height:36px;border-radius:50%}
.pl .tx{flex:1;min-width:0}
.pl .hn{display:block;font-weight:600}
.pl .rn{display:block;color:var(--mut);font-size:13px;line-height:18px}
.pl .nat{color:var(--mut);font-size:13px;font-weight:600}
.note{margin:0;padding:12px 16px 16px;color:var(--mut);font-size:13px;line-height:18px}

@media (prefers-reduced-motion:reduce){.dots i.new,.big-dots i.new{animation:none}*{transition:none!important}}
@media (max-width:899px){
  .hd-in{grid-template-columns:1fr auto;grid-template-areas:"logo status" "sec sec";height:auto;row-gap:6px;padding-top:12px;padding-bottom:0}
  .logo{grid-area:logo}.status{grid-area:status}
  .sec{grid-area:sec;height:44px}
  .sec a{padding:0 12px}
  .seg{justify-self:stretch}
  .shell.wide{grid-template-columns:minmax(0,1fr)}
  .side{position:static;max-height:240px}
  .news .nw{grid-template-columns:96px minmax(0,1fr);gap:12px;padding:12px}
  .news .pic{width:96px;height:64px}
  .seg button{justify-content:center}
  .shell{grid-template-columns:minmax(0,1fr);padding:12px}  /* 1fr would grow to the day tabs' width */
}
@media (max-width:560px){
  .row{grid-template-columns:52px minmax(0,1fr) auto 24px;column-gap:12px;padding:10px 12px}
  .th{padding:12px 12px 8px;flex-wrap:wrap}
  .hero{padding:4px 12px 20px;gap:8px}
  .side-t .av{width:52px;height:52px;border-radius:14px}
  .side-t .nm{font-size:15px;line-height:19px}
  .mid .score{font-size:34px;line-height:40px}
  .gm{grid-template-columns:minmax(0,1fr) 72px minmax(0,1fr);padding:0 12px}
  .half{grid-template-columns:minmax(0,1fr) 52px}
  .half.l{grid-template-columns:52px minmax(0,1fr)}
  .meta b{display:none}
  .ros{grid-template-columns:1fr}
  .status .mine{padding:6px 12px;white-space:nowrap}
  .status .lb{display:none}  /* the star says it; keeps logo and buttons on one row */
  .ros > div + div{border-left:0;border-top:1px solid var(--line)}
}
</style>
</head>
<body>
<header class="hd"><div class="hd-in">
  <a class="logo" href="#" aria-label="Undercard, all matches"><svg viewBox="2 3 28 26" aria-hidden="true"><path d="M12.03 12.44 16 5.5l3.97 6.94M7.97 19.56 4 26.5h8M20 26.5h8l-3.97-6.94" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="16" cy="19.5" r="2" fill="currentColor"/></svg><span>Undercard</span></a>
  <nav class="sec" id="sec" aria-label="Sections"></nav>
  <div class="status" id="mode"></div>
</div><nav class="gbar" aria-label="Games"><div class="gbar-in" id="games"></div></nav></header>
<div class="shell" id="shell">
  <aside class="side card" id="side" aria-label="Leagues" hidden></aside>
  <div class="col">
    <div class="tools" id="tools"><div class="seg" id="tabs" role="tablist" aria-label="Match status"></div><button class="mine" id="tier" data-tier aria-pressed="false">Top tiers only</button></div>
    <main id="list" aria-live="polite"></main>
  </div>
</div>
<p class="foot" id="foot"></p>
<script>
// Most popular first: this order is the order of the game bar (start.gg fighting games included)
const GAMES={"league-of-legends":"LoL","cs-go":"CS2","valorant":"Valorant","dota-2":"Dota 2","mlbb":"Mobile Legends",
  "rl":"Rocket League","ow":"Overwatch 2","cod-mw":"Call of Duty","r6-siege":"Rainbow Six","pubg":"PUBG",
  "kog":"Honor of Kings","sf6":"Street Fighter 6","tekken-8":"Tekken 8","ssbu":"Smash Ultimate","fifa":"EA FC",
  "lol-wild-rift":"Wild Rift","starcraft-2":"StarCraft II","ggst":"Guilty Gear Strive","ssbm":"Smash Melee",
  "mk1":"Mortal Kombat 1","2xko":"2XKO","fatal-fury":"Fatal Fury","starcraft-brood-war":"StarCraft BW"};
// Official site of each game, for its favicon (Google's favicon service, no key needed)
const GSITE={"league-of-legends":"leagueoflegends.com","cs-go":"counter-strike.net","dota-2":"dota2.com","valorant":"playvalorant.com",
  "rl":"rocketleague.com","ow":"overwatch.blizzard.com","kog":"honorofkings.com","starcraft-2":"starcraft2.blizzard.com",
  "r6-siege":"ubisoft.com","pubg":"pubg.com","mlbb":"mobilelegends.com","lol-wild-rift":"wildrift.leagueoflegends.com",
  "fifa":"ea.com","cod-mw":"callofduty.com","starcraft-brood-war":"starcraft.blizzard.com","sf6":"streetfighter.com",
  "tekken-8":"tekken.com","ssbu":"smashbros.com","ssbm":"smashbros.com","ggst":"guiltygear.com","mk1":"mortalkombat.com",
  "2xko":"2xko.riotgames.com","fatal-fury":"snk-corp.co.jp"};
const gico=s=>GSITE[s]?`<img class="gi" src="https://www.google.com/s2/favicons?sz=64&domain=${GSITE[s]}" alt="" loading="lazy" onerror="this.remove()">`:"";
const lgi=m=>{const u=safeUrl(m.league_image_url);return u?`<img class="lgi" src="${esc(u)}" alt="" loading="lazy" onerror="this.remove()">`:""};
const DAYS=[-1,0,1,2];  // yesterday to the day after tomorrow
const LOCAL=["localhost","127.0.0.1",""].includes(location.hostname);
/* FastAPI serves this page and the API from the same origin (locally and on Render). Only a page opened
   as a file or from another local dev server needs to point at the local API. ?api= overrides both. */
const API=new URLSearchParams(location.search).get("api")||
  (location.protocol==="file:"||(LOCAL&&location.port!=="8000")?"http://localhost:8000":location.origin);
const TZ=Intl.DateTimeFormat().resolvedOptions().timeZone;
let LIVE=[],DAY=[],V="live",G="all",L=null,LEAGUES={},demo=true,CUR=null,TEAM=localStorage.getItem("undercard.team")||"";
const SEEN=new Map();  // match id -> "s1|s2", to animate newly won games

/* Demo data, same shape as GET /matches */
const R=[
 ["league-of-legends","Demo League","Playoffs","running",-34,5,"best_of","Nova Esports","NOV","Iron Wolves","IRW",1,1],
 ["league-of-legends","Demo League","Playoffs","not_started",95,3,"best_of","Crimson Tide","CRT","Lunar Fox","LNF",null,null],
 ["league-of-legends","Demo League","Playoffs","finished",-310,3,"best_of","Sky Forge","SKF","Pale Owls","PLO",2,0],
 ["cs-go","Open Series","Group stage","running",-52,3,"best_of","Vortex","VTX","Static Void","STV",1,0],
 ["cs-go","Open Series","Group stage","finished",-200,3,"best_of","Red Mirage","RDM","Echo Unit","ECU",2,1],
 ["cs-go","Open Series","Group stage","not_started",1560,3,"best_of","Black Anchor","BLA","Zen Pack","ZNP",null,null],
 ["dota-2","Demo Cup","Quarterfinals","running",-70,5,"best_of","Titan Root","TTR","Glass Cannon","GLC",0,1],
 ["dota-2","Demo Cup","Quarterfinals","not_started",240,3,"best_of","Night Relay","NRL","Gold Harbor","GDH",null,null],
 ["valorant","Demo Masters","Swiss stage","finished",-120,3,"best_of","Ember Squad","EMB","Frost Cell","FRC",2,1],
 ["ow","Demo Champions","Playoffs","running",-95,4,"first_to","Pulse Drift","PLD","Neon Pact","NNP",2,3],
 ["rl","Demo Series","Final","not_started",150,7,"best_of","Apex Orbit","APX","Rift Garage","RFG",null,null]
].map((r,i)=>{const[vg,lg,tn,st,off,bo,mt,n1,a1,n2,a2,s1,s2]=r;
 const w=st==="finished"?(s1>s2?i*2+1:i*2+2):null;
 return{id:i+1,videogame:vg,name:n1+" vs "+n2,status:st,league_name:lg,tournament_name:tn,
  scheduled_at:new Date(Date.now()+off*6e4).toISOString(),number_of_games:bo,match_type:mt,
  team1:{id:i*2+1,name:n1,acronym:a1},team2:{id:i*2+2,name:n2,acronym:a2},
  team1_score:s1,team2_score:s2,winner_id:w}});

const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const gname=s=>GAMES[s]||s;
const rank=s=>{const i=Object.keys(GAMES).indexOf(s);return i<0?999:i};
let TOP=localStorage.getItem("undercard.top")==="1";
// start.gg rows have no tier, but only notable events are kept anyway
const inTier=m=>!TOP||m.source==="startgg"||m.tier==="s"||m.tier==="a";
const inGame=m=>(G==="all"||m.videogame===G)&&inTier(m);
let FAV=(()=>{try{return JSON.parse(localStorage.getItem("undercard.favs"))||{}}catch{return{}}})();
FAV={teams:FAV.teams||{},leagues:FAV.leagues||{}};  // teams: id -> {name,image_url}; leagues: name -> {image_url}
const saveFav=()=>localStorage.setItem("undercard.favs",JSON.stringify(FAV));
const favCount=()=>Object.keys(FAV.teams).length+Object.keys(FAV.leagues).length;
const starBtn=(attrs,on)=>`<button class="star" ${attrs} aria-pressed="${on}">${ICON.star}${on?"Following":"Follow"}</button>`;
const view=()=>V==="live"&&!L?LIVE:DAY;
const dayStart=off=>{const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()+off);return d};
const dayLabel=off=>off===-1?"Yesterday":off===0?"Today":off===1?"Tomorrow":dayStart(off).toLocaleDateString("en-GB",{weekday:"short",day:"numeric"});
const inDay=(m,off)=>{const t=new Date(m.scheduled_at);return t>=dayStart(off)&&t<dayStart(off+1)};
const base=()=>API.replace(/\/$/,"");
const safeUrl=u=>/^https?:\/\//i.test(u||"")?u:null;
/* first_to (Overwatch): number_of_games = wins needed; best_of: series length */
const need=m=>m.match_type==="first_to"?(m.number_of_games||1):Math.ceil((m.number_of_games||3)/2);
const fmt=m=>m.match_type==="first_to"?`First to ${m.number_of_games||"?"}`:`Best of ${m.number_of_games||"?"}`;
const STATUS={canceled:"Canceled",postponed:"Postponed"};
const ICON={
  back:`<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3.5 5.5 8l4.5 4.5"/></svg>`,
  out:`<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3.5h6.5V10M12.5 3.5 4 12"/></svg>`,
  star:`<svg viewBox="0 0 16 16" aria-hidden="true"><path d="m8 1.8 1.9 3.9 4.3.6-3.1 3 .7 4.3L8 11.6l-3.8 2 .7-4.3-3.1-3 4.3-.6z"/></svg>`,
  results:`<svg viewBox="0 0 20 20" aria-hidden="true"><rect x="2.5" y="4" width="15" height="12" rx="2.5"/><path d="M10 4v12M6 8v4M13 8h1.5v4H13z"/></svg>`,
  news:`<svg viewBox="0 0 20 20" aria-hidden="true"><rect x="3" y="3" width="14" height="14" rx="2.5"/><path d="M6 7h8M6 10h8M6 13h5"/></svg>`,
  leagues:`<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M6 3.5h8v4a4 4 0 0 1-8 0zM6 5H3.5v1.5A2.5 2.5 0 0 0 6 9M14 5h2.5v1.5A2.5 2.5 0 0 1 14 9M10 11.5v3M7 16.5h6"/></svg>`};

function when(iso){
  if(!iso)return["",""];
  const d=new Date(iso),n=new Date();
  const diff=Math.round((new Date(d.getFullYear(),d.getMonth(),d.getDate())-new Date(n.getFullYear(),n.getMonth(),n.getDate()))/864e5);
  const day=diff===0?"Today":diff===1?"Tomorrow":diff===-1?"Yesterday":d.toLocaleDateString("en-GB",{day:"numeric",month:"short"});
  return[day,d.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"})];
}
function eta(iso){
  const mins=Math.round((new Date(iso)-Date.now())/6e4);
  if(mins<1)return"Starting";
  if(mins<60)return`In ${mins} min`;
  return null;
}
const initials=t=>(t.acronym||t.name||"?").slice(0,3);
const av=t=>`<span class="av${t.image_url?" img":""}"><span class="ini">${esc(initials(t))}</span>${t.image_url?`<img src="${esc(t.image_url)}" alt="" loading="lazy" crossorigin="anonymous" onload="tone(this)" onerror="this.parentNode.classList.remove('img');this.remove()">`:""}</span>`;

/* Pick a plate a logo can be read on (PandaScore's CDN allows CORS reads) */
const TONE=new Map();
function tone(img){
  const apply=t=>t&&img.parentNode&&img.parentNode.classList.add(t);
  if(TONE.has(img.src))return apply(TONE.get(img.src));
  try{
    const c=document.createElement("canvas");c.width=c.height=24;
    const x=c.getContext("2d",{willReadFrequently:true});x.drawImage(img,0,0,24,24);
    const d=x.getImageData(0,0,24,24).data;let sum=0,n=0;
    for(let i=0;i<d.length;i+=4){if(d[i+3]<128)continue;sum+=(.2126*d[i]+.7152*d[i+1]+.0722*d[i+2])/255;n++}
    const l=n?sum/n:.5,t=l<.45?"dk":l>.75?"lt":"md";  // only extreme marks need a contrasting tile
    TONE.set(img.src,t);apply(t);
  }catch{TONE.set(img.src,"")}
}

/* Series dots: one per game to win; red marks the game in play */
function dots(m,score,fresh){
  const n=need(m),live=m.status==="running",s=score||0;
  let out="";
  for(let i=0;i<n;i++){
    const cls=i<s?"f"+(fresh&&i===s-1?" new":""):live&&i===s?"lv":"";
    out+=`<i${cls?` class="${cls}"`:""}></i>`;
  }
  return out;
}
function freshness(m){
  const prev=SEEN.get(m.id);SEEN.set(m.id,`${m.team1_score}|${m.team2_score}`);
  if(!prev)return[false,false];
  const[p1,p2]=prev.split("|").map(Number);
  return[m.team1_score>p1,m.team2_score>p2];
}
function label(m){
  const a=m.team1?.name||"TBD",b=m.team2?.name||"TBD";
  if(m.status==="running")return`${a} ${m.team1_score??0}, ${b} ${m.team2_score??0}, live, ${fmt(m)}`;
  if(m.status==="finished")return`${a} ${m.team1_score??0}, ${b} ${m.team2_score??0}, final`;
  const[day,time]=when(m.scheduled_at);
  return`${a} versus ${b}, ${STATUS[m.status]||day+" "+time}, ${fmt(m)}`;
}
function statusCell(m){
  const[day,time]=when(m.scheduled_at),start=when(m.begin_at||m.scheduled_at)[1];
  if(m.status==="running")return`<span class="lv">Live</span><span>Game ${(m.team1_score||0)+(m.team2_score||0)+1}</span><span class="num">${start}</span>`;
  const d=typeof V==="number"&&!L&&!CUR?"":day;  // a day tab already says which day it is
  if(m.status==="finished")return`<b>Final</b><span class="num">${d?d+" ":""}${start}</span>`;
  if(STATUS[m.status])return`<b>${STATUS[m.status]}</b><span>${d}</span>`;
  return`<b class="num">${time}</b><span>${eta(m.scheduled_at)||d}</span>`;
}
function row(m){
  const fin=m.status==="finished",scored=m.status==="running"||fin;
  const w1=fin&&m.winner_id===m.team1?.id,w2=fin&&m.winner_id===m.team2?.id;
  const[f1,f2]=freshness(m);
  const tm=(t,w)=>t?`<span class="tm ${fin?(w?"win":"lo"):""}">${av(t)}<span class="nm">${esc(t.name)}</span></span>`
    :`<span class="tm tbd"><span class="av">?</span><span class="nm">TBD</span></span>`;
  const sc=scored?`<span class="${fin&&!w1?"lo":""}">${m.team1_score??0}</span><span class="${fin&&!w2?"lo":""}">${m.team2_score??0}</span>`:"";
  return`<a class="row ${m.status==="running"?"run":""}" href="#/match/${m.id}" aria-label="${esc(label(m))}">
    <span class="st">${statusCell(m)}</span>
    <span class="teams">${tm(m.team1,w1)}${tm(m.team2,w2)}</span>
    <span class="dots" aria-hidden="true"><span>${dots(m,scored?m.team1_score:0,f1)}</span><span>${dots(m,scored?m.team2_score:0,f2)}</span></span>
    <span class="sc num">${sc}</span></a>`;
}

function renderNav(){
  const data=NEWS_ON?(NEWS||[]).map(n=>({videogame:n.game||"other"})):CH_ON?[]:view();
  const slugs=[...new Set([...Object.keys(GAMES),...data.map(m=>m.videogame)])].sort((a,b)=>rank(a)-rank(b));
  const items=[["all","All games"],...slugs.filter(s=>s!=="other").map(s=>[s,gname(s)])].map(([s,l])=>[s,l,data.filter(m=>(s==="all"||m.videogame===s)&&(NEWS_ON||inTier(m))).length]);
  document.getElementById("games").innerHTML=items.map(([s,l,c])=>
    CH_ON?`<button aria-pressed="${G===s}" data-g="${esc(s)}">${gico(s)}${esc(l)}</button>`
    :`<button class="${c?"":"z"}" aria-pressed="${G===s}" data-g="${esc(s)}">${gico(s)}${esc(l)}<span class="c num">${c}</span></button>`).join("");
  const res=!NEWS_ON&&!CH_ON,cur=on=>on?'aria-current="page"':"";
  document.getElementById("sec").innerHTML=`<a href="#" ${cur(res)}>${ICON.results}Results</a><a href="#/news" ${cur(NEWS_ON)}>${ICON.news}News</a><a href="#/ranking" ${cur(CH_ON)}>${ICON.leagues}Ranking</a>`;
  document.getElementById("tools").hidden=!res||!!CUR;
  document.getElementById("tabs").hidden=!!L||V==="fav";
  const liveN=LIVE.filter(inGame).length;
  document.getElementById("tabs").innerHTML=
    `<button role="tab" aria-selected="${!CUR&&V==="live"}" data-v="live">${liveN?'<span class="dot" aria-hidden="true"></span>':""}Live<span class="c num">${liveN}</span></button>`+
    DAYS.map(o=>`<button role="tab" aria-selected="${!CUR&&V===o}" data-v="${o}">${dayLabel(o)}</button>`).join("");
  document.getElementById("mode").innerHTML=`<button class="mine" aria-pressed="${!CUR&&V==="fav"}" data-v="fav" aria-label="Favorites, ${favCount()}">${ICON.star}<span class="lb">Favorites</span><span class="c num">${favCount()}</span></button><button class="mine" aria-pressed="${!CUR&&V==="team"}" data-v="team">My team</button>`;
  document.getElementById("tier").setAttribute("aria-pressed",TOP);
}
function renderList(){
  const ms=view().filter(inGame);
  const el=document.getElementById("list");
  const lgInfo=L&&(LEAGUES[G]||[]).find(x=>x.name===L);
  const top=L?`<section class="card phead">${lgi({league_image_url:lgInfo?.image_url})}<div class="tx"><h1>${esc(L)}</h1><div class="sub">${esc(gname(G))}</div></div>${starBtn(`data-fav-l="${esc(L)}" data-img="${esc(lgInfo?.image_url||"")}"`,!!FAV.leagues[L])}</section>`
    :V==="team"?PICK():V==="fav"?FAVS():"";
  if(!ms.length){
    const msg=L?`No matches for ${esc(L)} in the last 30 days`
      :V==="fav"?(favCount()?"No matches for your favorites in the last 30 days":"Follow teams and leagues with the star button to see them here")
      :V==="live"?"No live matches right now"
      :V==="team"?(TEAM?`No matches for ${esc(TEAM)} in the last 30 days`:"Choose a team to follow its matches in every game")
      :`No matches ${V===0?"today":V===1?"tomorrow":V===-1?"yesterday":"on this day"}${G==="all"?"":` for ${gname(G)}`}`;
    const go=V==="live"?`<button class="btn" data-v="0">See today's matches</button>`:G!=="all"?`<button class="btn" data-g="all">Show all games</button>`:"";
    el.innerHTML=top+`<div class="card empty"><p>${msg}</p>${go}</div>`;
    return;
  }
  const sorted=sortMatches(ms,L||V==="fav"?"plan":V==="team"?"desc":"asc");
  el.innerHTML=top+groupsHtml(sorted);
}
const step=m=>m.status==="running"?0:m.status==="finished"?2:1;
// asc: by time; desc: newest first; plan: live, then next (soonest first), then results (newest first)
function sortMatches(ms,order){
  const t=m=>new Date(m.scheduled_at);
  return[...ms].sort(order==="plan"?(a,b)=>step(a)-step(b)||(step(a)===2?t(b)-t(a):t(a)-t(b)):order==="desc"?(a,b)=>t(b)-t(a):(a,b)=>t(a)-t(b));
}
function groupsHtml(sorted){
  const key=m=>m.videogame+"|"+m.league_name+"|"+m.tournament_name;
  const groups=new Map();  // insertion order follows the sort, so tournaments appear by their first match
  sorted.forEach(m=>{if(!groups.has(key(m)))groups.set(key(m),[]);groups.get(key(m)).push(m)});
  return[...groups.values()].map(list=>{
    const f=list[0],same=list.every(m=>fmt(m)===fmt(f));
    return`<section class="card" aria-label="${esc(f.league_name)}"><div class="th"><span class="lg">${lgi(f)}${esc(f.league_name)}${f.tournament_name?`<span>${esc(f.tournament_name)}</span>`:""}</span><span class="rt"><span class="gn">${gico(f.videogame)}${esc(gname(f.videogame))}</span>${same?`<span>${fmt(f)}</span>`:""}</span></div>`+
      list.map(row).join("")+`</section>`}).join("");
}
function renderSide(){
  const side=document.getElementById("side"),show=!NEWS_ON&&!CH_ON&&!CUR&&G!=="all";
  side.hidden=!show;document.getElementById("shell").classList.toggle("wide",show);
  if(!show)return;
  const list=LEAGUES[G];
  if(!list){side.innerHTML=`<h2>Leagues</h2><p class="note">Loading</p>`;loadLeagues(G).then(()=>G in LEAGUES&&renderSide());return}
  const b=(l,label,c,img)=>`<button class="lg-b" aria-pressed="${L===l}" data-l="${esc(l||"")}">${img}<span class="n">${esc(label)}</span>${c==null?"":`<span class="c num">${c}</span>`}</button>`;
  side.innerHTML=`<h2>${esc(gname(G))} leagues</h2>`+b(null,"All leagues",null,gico(G))+
    (list.length?list.map(x=>b(x.name,x.name,x.matches,lgi({league_image_url:x.image_url})||'<span class="ph"></span>')).join(""):`<p class="note">No leagues in the last 30 days</p>`);
}
async function loadLeagues(g){
  if(demo){LEAGUES[g]=[...new Set(R.filter(m=>m.videogame===g).map(m=>m.league_name))].map(name=>({name,matches:R.filter(m=>m.league_name===name).length}));return}
  try{const r=await fetch(base()+"/leagues?videogame="+encodeURIComponent(g));LEAGUES[g]=r.ok?await r.json():[]}catch{LEAGUES[g]=[]}
}
/* Ranking section (#/ranking): game, then league, then the standings of its current tournament */
let CH_ON=false,CHL=null;
const STAND={};  // league -> {at, title, rows}, refetched after 10 minutes like the API cache
async function loadStand(l){
  let rows=[],title=l;
  if(!demo){try{
    const ms=sortMatches(await getMatches(new URLSearchParams({league:l,limit:"500"})),"plan");
    const cur=ms.find(m=>m.status==="running")||ms.find(m=>m.status==="finished")||ms[0];  // current tournament
    if(cur&&cur.source!=="startgg"){title=cur.tournament_name?`${l}, ${cur.tournament_name}`:l;
      const r=await fetch(base()+"/matches/"+cur.id+"/standings");if(r.ok)rows=await r.json()}
  }catch{}}
  STAND[l]={at:Date.now(),title,rows};
}
const standTable=rows=>`<table class="stand"><thead><tr><th>#</th><th>Team</th><th>Last match</th></tr></thead><tbody>${rows.map(r=>{
  const lm=r.last_match,res=lm?.winner_id?(lm.winner_id===r.team.id?"W":"L"):"";
  return`<tr><td class="num">${r.rank}</td><td><span class="tm">${av(r.team)}<a href="#/team/${r.team.id}">${esc(r.team.name)}</a></span></td><td>${lm?`${res?`<b class="res ${res}">${res}</b>`:""}<a href="#/match/${lm.id}">${esc(lm.name)}</a>`:""}</td></tr>`}).join("")}</tbody></table>`;
function renderChamps(){
  const el=document.getElementById("list");
  document.title="Ranking · Undercard";
  if(G==="all"){el.innerHTML=`<section class="card"><div class="sec-h"><h2>Pick a game</h2></div><div class="picks">${
    Object.keys(GAMES).map(g=>`<button class="lg-b" data-g="${esc(g)}">${gico(g)}<span class="n">${esc(gname(g))}</span></button>`).join("")}</div></section>`;return}
  const list=LEAGUES[G];
  if(!list){el.innerHTML=`<div class="card empty"><p>Loading leagues</p></div>`;const g=G;loadLeagues(g).then(()=>CH_ON&&G===g&&render());return}
  if(!CHL){el.innerHTML=list.length?`<section class="card"><div class="sec-h"><h2>${esc(gname(G))} leagues</h2><span>Last 30 days</span></div><div class="picks">${
    list.map(x=>`<button class="lg-b" data-ch="${esc(x.name)}">${lgi({league_image_url:x.image_url})||'<span class="ph"></span>'}<span class="n">${esc(x.name)}</span><span class="c num">${x.matches}</span></button>`).join("")}</div></section>`
    :`<div class="card empty"><p>No ${esc(gname(G))} leagues in the last 30 days</p></div>`;return}
  const info=list.find(x=>x.name===CHL),st=STAND[CHL];
  const head=`<button class="back" data-ch="">${ICON.back}${esc(gname(G))} leagues</button><section class="card phead">${lgi({league_image_url:info?.image_url})}<div class="tx"><h1>${esc(CHL)}</h1><div class="sub">${esc(gname(G))}</div></div>${starBtn(`data-fav-l="${esc(CHL)}" data-img="${esc(info?.image_url||"")}"`,!!FAV.leagues[CHL])}</section>`;
  if(!st||Date.now()-st.at>6e5){if(!st)el.innerHTML=head+`<div class="card empty"><p>Loading ranking</p></div>`;const l=CHL;loadStand(l).then(()=>CH_ON&&CHL===l&&render());if(!st)return}
  el.innerHTML=head+(st.rows.length?`<section class="card"><div class="sec-h"><h2>Ranking</h2><span>${esc(st.title)}</span></div>${standTable(st.rows)}</section>`
    :`<div class="card empty"><p>No ranking for ${esc(CHL)} yet</p></div>`);
}
const FAVS=()=>favCount()?`<section class="card"><div class="sec-h"><h2>Following</h2></div><div class="favs">${
  Object.entries(FAV.teams).map(([id,t])=>`<span class="fav"><a href="#/team/${id}">${av(t)}${esc(t.name)}</a><button data-unfav-t="${id}" aria-label="Unfollow ${esc(t.name)}">✕</button></span>`).join("")}${
  Object.entries(FAV.leagues).map(([n,l])=>`<span class="fav">${lgi({league_image_url:l.image_url})}<span>${esc(n)}</span><button data-unfav-l="${esc(n)}" aria-label="Unfollow ${esc(n)}">✕</button></span>`).join("")}</div></section>`:"";
function render(){renderNav();renderSide();if(NEWS_ON)renderNews();else if(CH_ON&&!CUR)renderChamps();else if(CUR)showPage(false);else renderList()}

/* News: #/news, headlines from esports RSS feeds via the API */
let NEWS=null,NEWS_ON=false;
const ago=iso=>{const m=Math.round((Date.now()-new Date(iso))/6e4);return m<60?`${Math.max(m,1)} min ago`:m<1440?`${Math.round(m/60)} h ago`:`${Math.round(m/1440)} d ago`};
async function loadNews(){
  if(demo){NEWS=[];return}
  try{const r=await fetch(base()+"/news");NEWS=r.ok?await r.json():[]}catch{NEWS=[]}
}
function renderNews(){
  const el=document.getElementById("list");
  if(!NEWS){el.innerHTML=`<div class="card empty"><p>Loading news</p></div>`;return}
  const list=NEWS.filter(n=>G==="all"||n.game===G);
  if(!list.length){el.innerHTML=`<div class="card empty"><p>${demo?"News appears when the API is connected":"No news"+(G==="all"?"":` for ${gname(G)}`)}</p>${G!=="all"?`<button class="btn" data-g="all">Show all games</button>`:""}</div>`;return}
  el.innerHTML=`<section class="card news">${list.map(n=>{const img=safeUrl(n.image_url);
    return`<a class="nw ${img?"":"noimg"}" href="${esc(safeUrl(n.url)||"#")}" target="_blank" rel="noopener noreferrer">${img?`<img class="pic" src="${esc(img)}" alt="" loading="lazy" onerror="this.remove()">`:""}<span><span class="t">${esc(n.title)}</span>${n.summary?`<span class="sm">${esc(n.summary)}</span>`:""}<span class="mt">${gico(n.game)}${esc(n.source)}${n.published_at?` · ${ago(n.published_at)}`:""}</span></span></a>`}).join("")}</section>`;
}
const PICK=()=>`<form class="card pick" id="pick"><label for="team-q">My team</label>
  <span class="pick-in"><input id="team-q" value="${esc(TEAM)}" placeholder="Search a team, e.g. Team Liquid" autocomplete="off" aria-controls="team-sugg">
  <span class="sugg" id="team-sugg" role="list"></span></span><button class="btn">Show matches</button></form>`;
document.addEventListener("submit",async e=>{
  if(e.target.id!=="pick")return;
  e.preventDefault();
  TEAM=document.getElementById("team-q").value.trim();
  localStorage.setItem("undercard.team",TEAM);
  await loadDay();render();
});
document.addEventListener("input",async e=>{
  if(e.target.id!=="team-q")return;
  const q=e.target.value.trim(),box=document.getElementById("team-sugg");
  if(q.length<2){box.innerHTML="";return}
  let teams;
  try{teams=demo?[...new Set(R.flatMap(m=>[m.team1.name,m.team2.name]))].filter(n=>n.toLowerCase().includes(q.toLowerCase())).map(name=>({name}))
    :await(await fetch(base()+"/teams?q="+encodeURIComponent(q))).json()}catch{return}
  if(e.target.value.trim()!==q)return;  // a newer keystroke already asked again
  box.innerHTML=teams.length?teams.map(t=>`<button type="button" role="listitem" data-team="${esc(t.name)}">${av(t)}<span>${esc(t.name)}</span></button>`).join("")
    :`<span class="none">No team found</span>`;
});
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-team]");
  if(t){document.getElementById("team-q").value=t.dataset.team;document.getElementById("pick").requestSubmit();return}
  if(!e.target.closest(".pick-in")){const box=document.getElementById("team-sugg");if(box)box.innerHTML=""}  // close on outside click
});

document.addEventListener("click",async e=>{
  const ft=e.target.closest("[data-fav-t],[data-unfav-t]"),fl=e.target.closest("[data-fav-l],[data-unfav-l]");
  if(ft||fl){
    if(ft){const id=ft.dataset.favT||ft.dataset.unfavT;
      if(FAV.teams[id])delete FAV.teams[id];else FAV.teams[id]={name:ft.dataset.name,image_url:ft.dataset.img||null}}
    else{const n=fl.dataset.favL||fl.dataset.unfavL;
      if(FAV.leagues[n])delete FAV.leagues[n];else FAV.leagues[n]={image_url:fl.dataset.img||null}}
    saveFav();if(V==="fav"&&!L)await loadDay();render();return;
  }
  if(e.target.closest("[data-tier]")){TOP=!TOP;localStorage.setItem("undercard.top",TOP?"1":"0");render();return}
  const g=e.target.closest("[data-g]"),v=e.target.closest("[data-v]");
  const ch=e.target.closest("[data-ch]");
  if(ch){CHL=ch.dataset.ch||null;render();window.scrollTo(0,0);return}
  if(CH_ON&&g){G=g.dataset.g;CHL=null;render();return}
  const l=e.target.closest("[data-l]");
  if(l){L=l.dataset.l||null;DAY=[];render();await loadDay();render();return}
  if((g||v)&&L){L=null;if(!v)await loadDay()}  // leaving a league: back to the day lists
  if(g)G=g.dataset.g;
  if(v){const x=v.dataset.v;V=x==="live"||x==="team"||x==="fav"?x:+x;await loadDay()}
  if(g||v){if(CUR||((NEWS_ON||CH_ON)&&v))location.hash="";else render()}
});

/* Match page: #/match/<id> */
const BACK=`<a class="back" href="#">${ICON.back}All matches</a>`;
const mins=sec=>sec?`${Math.round(sec/60)} min`:"";
function route(){
  const hit=location.hash.match(/^#\/(match|team|player)\/(-?\d+)$/);  // start.gg ids are negative
  CUR=hit?hit[1]+":"+hit[2]:null;
  const news=location.hash==="#/news",champs=location.hash==="#/ranking";
  if(news!==NEWS_ON||champs!==CH_ON){G="all";CHL=null}  // each section has its own games
  NEWS_ON=news;CH_ON=champs;
  renderNav();renderSide();
  if(CH_ON)renderChamps();
  else if(NEWS_ON){document.title="News · Undercard";renderNews();if(!NEWS)loadNews().then(()=>NEWS_ON&&render())}
  else if(CUR)showPage(true);else{renderList();document.title="Undercard"}
}
function showPage(top){
  const[kind,id]=CUR.split(":");
  (kind==="team"?showTeam:kind==="player"?showPlayer:showMatch)(+id,top);
}
const age=b=>{if(!b)return null;const d=new Date(b),n=new Date();return n.getFullYear()-d.getFullYear()-(n<new Date(n.getFullYear(),d.getMonth(),d.getDate())?1:0)};
const notFound=what=>`${BACK}<div class="card empty"><p>${what} not found</p></div>`;
async function showTeam(id,top){
  const key="team:"+id,el=document.getElementById("list");
  let t=null,ms=[];
  if(demo){ms=R.filter(m=>m.team1?.id===id||m.team2?.id===id);t=ms[0]&&(ms[0].team1?.id===id?ms[0].team1:ms[0].team2)}
  else try{[t,ms]=await Promise.all([fetch(base()+"/teams/"+id).then(r=>r.ok?r.json():null),getMatches("team_id="+id+"&limit=200")])}catch{}
  if(CUR!==key)return;
  if(!t){el.innerHTML=notFound("Team");return}
  const game=ms[0]?.videogame,on=!!FAV.teams[id];
  const roster=(t.players||[]).map(p=>`<a class="pl" href="#/player/${p.id}">${av({name:p.name,image_url:p.image_url})}<span class="tx"><span class="hn">${esc(p.name)}</span><span class="rn">${[[p.first_name,p.last_name].filter(Boolean).join(" "),p.role].filter(Boolean).map(esc).join(", ")}</span></span><span class="nat">${esc(p.nationality)}</span></a>`).join("");
  el.innerHTML=`${BACK}<section class="card phead">${av(t)}<div class="tx"><h1>${esc(t.name)}</h1><div class="sub">${t.acronym?`<span>${esc(t.acronym)}</span>`:""}${game?`<span class="gn">${gico(game)}${esc(gname(game))}</span>`:""}</div></div>${starBtn(`data-fav-t="${id}" data-name="${esc(t.name)}" data-img="${esc(t.image_url||"")}"`,on)}</section>`+
    (id>0?`<section class="card"><div class="sec-h"><h2>Roster</h2></div><div class="ros1">${roster||`<p class="note">Roster not synced yet.</p>`}</div></section>`:"")+
    (ms.length?groupsHtml(sortMatches(ms,"plan")):`<div class="card empty"><p>No matches in the last 30 days</p></div>`);
  document.title=t.name+" · Undercard";
  if(top)window.scrollTo(0,0);
}
async function showPlayer(id,top){
  const key="player:"+id,el=document.getElementById("list");
  let p=null,ms=[];
  if(!demo)try{p=await fetch(base()+"/players/"+id).then(r=>r.ok?r.json():null);if(p?.team)ms=await getMatches("team_id="+p.team.id+"&limit=100")}catch{}
  if(CUR!==key)return;
  if(!p){el.innerHTML=notFound("Player");return}
  const real=[p.first_name,p.last_name].filter(Boolean).join(" "),a=age(p.birthday);
  const facts=[["Real name",real],["Role",p.role],["Nationality",p.nationality],["Age",a!=null?`${a} (born ${new Date(p.birthday).toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"})})`:""]].filter(([,v])=>v);
  el.innerHTML=`${BACK}<section class="card phead">${av({name:p.name,image_url:p.image_url})}<div class="tx"><h1>${esc(p.name)}</h1><div class="sub">${p.team?`<a href="#/team/${p.team.id}">${esc(p.team.name)}</a>`:"No current team"}</div></div></section>`+
    (facts.length?`<section class="card"><div class="sec-h"><h2>Profile</h2></div><dl class="facts">${facts.map(([k,v])=>`<div><dt>${k}</dt><dd>${esc(v)}</dd></div>`).join("")}</dl></section>`:"")+
    (ms.length?`<div class="sec-h" style="padding:0"><h2>${esc(p.team.name)} matches</h2></div>`+groupsHtml(sortMatches(ms,"plan")):"");
  document.title=p.name+" · Undercard";
  if(top)window.scrollTo(0,0);
}
async function showMatch(id,top){
  const key="match:"+id;
  let m=null;
  if(!demo){try{const r=await fetch(base()+"/matches/"+id);if(r.ok)m=await r.json()}catch{}}
  m=m||[...LIVE,...DAY,...(demo?R:[])].find(x=>x.id===id);
  if(CUR!==key)return;
  document.getElementById("list").innerHTML=m?renderDetail(m):`${BACK}<div class="card empty"><p>Match not found</p></div>`;
  document.title=m?`${m.team1?.name||"TBD"} vs ${m.team2?.name||"TBD"} · Undercard`:"Undercard";
  if(top)window.scrollTo(0,0);
  if(demo||!m||m.source==="startgg")return;
  addBracket(id,()=>CUR===key);
}
/* Playoff tree: one column per round, upper bracket then lower bracket */
async function addBracket(id,still){
  let rows=[];
  try{const r=await fetch(base()+"/matches/"+id+"/bracket");if(r.ok)rows=await r.json()}catch{}
  if(!still()||!rows.length)return;
  const team=(r,t)=>{const lo=r.winner_id&&t&&r.winner_id!==t.id;
    return`<span class="bk-t ${lo?"lo":""}">${t?av(t):'<span class="av">?</span>'}<span class="n">${esc(t?.acronym||t?.name||"TBD")}</span><span class="num">${t&&r.status!=="not_started"?t.score??"":""}</span></span>`};
  const cell=r=>`<a class="bk-m ${r.id===id?"me":""} ${r.status==="running"?"run":""}" href="#/match/${r.id}" title="${esc(r.name)}">${team(r,r.teams[0])}${team(r,r.teams[1])}</a>`;
  const side=(b,label)=>{const ms=rows.filter(r=>r.bracket===b);if(!ms.length)return"";
    const n=Math.max(...ms.map(r=>r.round));
    return(label?`<h3>${label}</h3>`:"")+`<div class="bk">${Array.from({length:n},(_,i)=>`<div class="bk-col">${ms.filter(r=>r.round===i+1).map(cell).join("")}</div>`).join("")}</div>`};
  const two=rows.some(r=>r.bracket==="lower");
  document.getElementById("bracket")?.remove();
  document.getElementById("list").insertAdjacentHTML("beforeend",`<section class="card" id="bracket"><div class="sec-h"><h2>Bracket</h2></div><div class="bk-wrap">${side("upper",two&&"Upper bracket")}${side("lower","Lower bracket")}</div></section>`);
}
function renderDetail(m){
  const live=m.status==="running",fin=m.status==="finished",scored=live||fin;
  const w1=fin&&m.winner_id===m.team1?.id,w2=fin&&m.winner_id===m.team2?.id;
  const[f1,f2]=freshness(m);
  const[day,time]=when(m.scheduled_at),started=when(m.begin_at||m.scheduled_at);
  const stream=safeUrl(m.stream_url);
  const team=(t,lose,score,fresh)=>t
    ?`<div class="side-t ${lose?"lo":""}">${av(t)}<a class="nm" href="#/team/${t.id}">${esc(t.name)}</a><span class="big-dots" aria-hidden="true">${dots(m,scored?score:0,fresh)}</span></div>`
    :`<div class="side-t"><span class="av">?</span><span class="nm">TBD</span></div>`;
  const center=scored
    ?`<span class="score num"><span class="${fin&&!w1?"lo":""}">${m.team1_score??0}</span> – <span class="${fin&&!w2?"lo":""}">${m.team2_score??0}</span></span>${live?`<span class="pill lv">Live, game ${(m.team1_score||0)+(m.team2_score||0)+1}</span>`:`<span class="pill">Final</span>`}`
    :`<span class="score num">${STATUS[m.status]?"–":time}</span><span class="pill">${STATUS[m.status]||eta(m.scheduled_at)||day}</span>`;
  let html=`${BACK}<section class="card"><div class="th"><span class="lg">${lgi(m)}${esc(m.league_name)}${m.tournament_name?`<span>${esc(m.tournament_name)}</span>`:""}</span><span class="rt"><span class="gn">${gico(m.videogame)}${esc(gname(m.videogame))}</span></span></div>
  <div class="hero">${team(m.team1,fin&&!w1,m.team1_score,f1)}<div class="mid">${center}<span class="fmt">${fmt(m)}${scored?`, started ${started[0]==="Today"?"":started[0]+" "}${started[1]}`:""}</span>${stream?`<a class="btn" href="${esc(stream)}" target="_blank" rel="noopener noreferrer">Watch stream${ICON.out}</a>`:""}</div>${team(m.team2,fin&&!w2,m.team2_score,f2)}</div></section>`;
  const tw=live&&stream&&/^https:\/\/(?:www\.)?twitch\.tv\/(\w+)\/?$/.exec(stream);
  if(tw)html+=`<section class="card tv-c"><iframe class="tv" src="https://player.twitch.tv/?channel=${tw[1]}&parent=${encodeURIComponent(location.hostname)}&autoplay=false" title="${esc(tw[1])} live on Twitch" allowfullscreen></iframe></section>`;
  const prize=m.prizepool&&m.prizepool.replace(/^\d+/,n=>(+n).toLocaleString("en"));
  const facts=[["Season",m.serie_name],["Prize pool",prize],["Region",[m.region,m.country].filter(Boolean).join(", ")]].filter(([,v])=>v);
  if(facts.length)html+=`<section class="card"><div class="sec-h"><h2>Tournament</h2></div><dl class="facts">${facts.map(([k,v])=>`<div><dt>${k}</dt><dd>${esc(v)}</dd></div>`).join("")}</dl></section>`;
  if(!m.games)return html+`<p class="foot" style="padding:0">Games and rosters appear when the API is connected.</p>`;
  const maxGames=m.match_type==="first_to"?2*(m.number_of_games||1)-1:(m.number_of_games||m.games.length);
  const games=m.games.filter(g=>g.position<=maxGames&&!(fin&&g.status==="not_started"));
  if(games.length){
    const won=games.filter(g=>g.winner_id);
    const timed=won.length>0&&won.every(g=>g.length);  // bars only when every duration is real
    const longest=Math.max(...won.map(g=>g.length||0),1);
    const lane=(side,mark,meta="")=>{
      const trk=`<span class="trk">${mark}</span>`,mt=`<span class="meta">${meta}</span>`;
      return`<span class="half ${side}">${side==="l"?mt+trk:trk+mt}</span>`};
    const half=(t,side,g)=>{
      if(!t||g.winner_id!==t.id)return lane(side,"");
      const mark=timed?`<span class="bar" style="width:${Math.max(4,Math.round(g.length/longest*100))}%"></span>`:`<span class="mark"></span>`;
      const who=`<b>${esc(t.acronym||t.name)}</b>`,len=g.length?`<span>${mins(g.length)}</span>`:"";
      return lane(side,mark,side==="l"?len+who:who+len)};
    html+=`<section class="card"><div class="sec-h"><h2>Game by game</h2>${timed?"<span>Bar length is game duration</span>":""}</div>`+games.map(g=>{
      const run=g.status==="running",todo=!g.winner_id&&!run;
      const c=run?`Game ${g.position}, live`:todo?`Game ${g.position}, not played`:`Game ${g.position}`;
      const live=`<span class="mark"></span>`;
      const l1=run?lane("l",live):half(m.team1,"l",g);
      const l2=run?lane("r",live):half(m.team2,"r",g);
      return`<div class="gm ${run?"run":""} ${todo?"todo":""}">${l1}<span class="c" aria-label="${c}">Game ${g.position}</span>${l2}</div>`}).join("")+`</section>`;
  }
  const roster=t=>t?`<div><h3>${av(t)}<a href="#/team/${t.id}">${esc(t.name)}</a></h3>${(t.players||[]).length?t.players.map(p=>{
      const sub=[[p.first_name,p.last_name].filter(Boolean).join(" "),p.role].filter(Boolean).map(esc).join(", ");
      return`<a class="pl" href="#/player/${p.id}">${av({name:p.name,image_url:p.image_url})}<span class="tx"><span class="hn">${esc(p.name)}</span>${sub?`<span class="rn">${sub}</span>`:""}</span><span class="nat">${esc(p.nationality)}</span></a>`}).join("")
    :`<p class="note" style="padding:8px 0">Roster not synced yet.</p>`}</div>`:"";
  if(m.source!=="startgg"&&(m.team1||m.team2))html+=`<section class="card"><div class="sec-h"><h2>Rosters</h2></div><div class="ros">${roster(m.team1)}${roster(m.team2)}</div><p class="note">Current team rosters, not necessarily the lineup for this match.</p></section>`;
  return html;
}

async function getMatches(query){const r=await fetch(base()+"/matches?"+query);if(!r.ok)throw 0;return r.json()}
async function loadLive(){LIVE=demo?R.filter(m=>m.status==="running"):await getMatches("status=running&limit=200")}
async function loadDay(){
  if(V==="fav"&&!L){
    const keep=m=>FAV.teams[m.team1?.id]||FAV.teams[m.team2?.id]||FAV.leagues[m.league_name];
    if(demo){DAY=R.filter(keep);return}
    const qs=[...Object.keys(FAV.teams).map(id=>({team_id:id})),...Object.keys(FAV.leagues).map(league=>({league}))];
    const lists=await Promise.all(qs.map(q=>getMatches(new URLSearchParams({...q,limit:"100"})).catch(()=>[])));
    DAY=[...new Map(lists.flat().map(m=>[m.id,m])).values()];
    return;
  }
  if(L){DAY=demo?R.filter(m=>m.league_name===L):await getMatches(new URLSearchParams({league:L,limit:"500"}));return}
  if(V==="live")return;
  if(V==="team"){
    const mine=m=>[m.team1?.name,m.team2?.name].some(n=>n&&n.toLowerCase()===TEAM.toLowerCase());
    DAY=!TEAM?[]:demo?R.filter(mine):await getMatches(new URLSearchParams({team:TEAM,limit:"500"}));
    return;
  }
  const q=new URLSearchParams({since:dayStart(V).toISOString(),until:dayStart(V+1).toISOString(),limit:"500"});
  DAY=demo?R.filter(m=>inDay(m,V)):await getMatches(q);
}
async function init(){
  document.getElementById("list").innerHTML=`<div class="card empty"><p>Loading matches</p></div>`;
  demo=!API;
  if(API){try{await loadLive()}catch{demo=true}}
  if(demo)await loadLive();
  V=LIVE.length?"live":0;
  try{await loadDay()}catch{}
  document.getElementById("foot").innerHTML=(demo?(LOCAL?"Local API not found: run <code>uvicorn app.main:app</code> in the backend folder, then reload. ":"To use your API, add <code>?api=http://localhost:8000</code> to this page address. "):"")+"Times shown in "+esc(TZ)+". Data from PandaScore and start.gg.";
  addEventListener("hashchange",route);
  route();
  setInterval(demo?simulate:refresh,demo?7000:30000);
}
/* Demo: advance live scores */
function simulate(){
  const live=R.filter(m=>m.status==="running");
  const m=live[Math.floor(Math.random()*live.length)];
  if(!m)return;
  const k=Math.random()<.5?"team1_score":"team2_score";
  if(m[k]+1>=need(m))return;
  m[k]++;render();
}
async function refresh(){if(document.hidden||document.activeElement?.closest?.("#pick"))return;try{await loadLive();await loadDay();render()}catch{}}
init();
</script>
