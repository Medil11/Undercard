  <rect x="3" y="13" width="5" height="6" fill="#f5f5f0"/>
  <rect x="9" y="13" width="5" height="6" fill="#ff3326"/>
  <rect x="18" y="13" width="5" height="6" fill="#ff3326"/>
  <rect x="24" y="13" width="5" height="6" fill="#3a3a37"/>
</svg>
